name: Reconcile Project Constellation v0.5.1

on:
  push:
    branches: [main]
    paths:
      - 'project-constellation/.staging/v0.5.1/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staged source artifacts and build canonical set
        shell: bash
        run: |
          set -euo pipefail
          STAGE="project-constellation/.staging/v0.5.1"
          test "$(wc -c < "$STAGE/Bert_Project_Second_Brain_Website.zip")" -eq 144481
          echo "f49eb085c230da9ea2c62b2d4e91770be0b2638bf47a188fa43f6ff2b537893c  $STAGE/Bert_Project_Second_Brain_Website.zip" | sha256sum -c -
          test "$(wc -c < "$STAGE/Bert_Project_Wiki_Pack.zip")" -eq 183831
          echo "9be52cefe088ef3b4dbdac906073c21f3b48c4265f25bff02aec5a0010163891  $STAGE/Bert_Project_Wiki_Pack.zip" | sha256sum -c -
          unzip -t "$STAGE/Bert_Project_Second_Brain_Website.zip"
          unzip -t "$STAGE/Bert_Project_Wiki_Pack.zip"
          rm -rf /tmp/pc-v051
          mkdir -p /tmp/pc-v051
          unzip -q "$STAGE/Bert_Project_Second_Brain_Website.zip" -d /tmp/pc-v051
          cp "$STAGE/Bert_Project_Second_Brain_Website.zip" project-constellation/Bert_Project_Second_Brain_Website.zip
          cp "$STAGE/Bert_Project_Wiki_Pack.zip" project-constellation/Bert_Project_Wiki_Pack.zip
          cp /tmp/pc-v051/Bert_Project_Constellation_Quick_View.html project-constellation/Bert_Project_Constellation_Quick_View.html
          cp /tmp/pc-v051/Bert_Project_Constellation_Recovery_Command_Center_Full_Wiki.html project-constellation/Bert_Project_Constellation_Recovery_Command_Center_Full_Wiki.html
          cp /tmp/pc-v051/Project-Constellation-Project-Catalog.json project-constellation/Project-Constellation-Project-Catalog.json
          cp /tmp/pc-v051/Project-Constellation-Research-Suggestions.json project-constellation/Project-Constellation-Research-Suggestions.json
          cat > /tmp/expected.sha256 <<'EOF'
          f49eb085c230da9ea2c62b2d4e91770be0b2638bf47a188fa43f6ff2b537893c  project-constellation/Bert_Project_Second_Brain_Website.zip
          8234e889c6b8cae67158c3cec525e3607bb8403173cf095e80c1b7ffd597ffe1  project-constellation/Bert_Project_Constellation_Quick_View.html
          dd1f852bf4f7d677d3a499a7238359dff55aa6a3bc3f338c534dca2c89faa1a8  project-constellation/Bert_Project_Constellation_Recovery_Command_Center_Full_Wiki.html
          9be52cefe088ef3b4dbdac906073c21f3b48c4265f25bff02aec5a0010163891  project-constellation/Bert_Project_Wiki_Pack.zip
          79c43dde274c7e4420a27d35ff58fdea4b7bdfc4c5cc412ad527c995eb8977ab  project-constellation/Project-Constellation-Project-Catalog.json
          c20f76e5eba87a21769dfe582ce8690e0b3dc62570e05ea8e5be87b9a610cac6  project-constellation/Project-Constellation-Research-Suggestions.json
          EOF
          sha256sum -c /tmp/expected.sha256
          python - <<'PY'
          import json
          for p in (
              "project-constellation/Project-Constellation-Project-Catalog.json",
              "project-constellation/Project-Constellation-Research-Suggestions.json",
          ):
              with open(p, encoding="utf-8") as f:
                  json.load(f)
          PY
          rm -rf "$STAGE"

      - name: Publish canonical artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-constellation
          if git diff --cached --quiet; then
            echo "Canonical artifacts already match."
            exit 0
          fi
          git commit -m "project-constellation: publish verified v0.5.1 presentation artifacts"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Remote verification from origin main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          TMP="$(mktemp -d)"
          git archive --format=tar origin/main project-constellation | tar -xf - -C "$TMP"
          cd "$TMP"
          cat > /tmp/expected.sha256 <<'EOF'
          f49eb085c230da9ea2c62b2d4e91770be0b2638bf47a188fa43f6ff2b537893c  project-constellation/Bert_Project_Second_Brain_Website.zip
          8234e889c6b8cae67158c3cec525e3607bb8403173cf095e80c1b7ffd597ffe1  project-constellation/Bert_Project_Constellation_Quick_View.html
          dd1f852bf4f7d677d3a499a7238359dff55aa6a3bc3f338c534dca2c89faa1a8  project-constellation/Bert_Project_Constellation_Recovery_Command_Center_Full_Wiki.html
          9be52cefe088ef3b4dbdac906073c21f3b48c4265f25bff02aec5a0010163891  project-constellation/Bert_Project_Wiki_Pack.zip
          79c43dde274c7e4420a27d35ff58fdea4b7bdfc4c5cc412ad527c995eb8977ab  project-constellation/Project-Constellation-Project-Catalog.json
          c20f76e5eba87a21769dfe582ce8690e0b3dc62570e05ea8e5be87b9a610cac6  project-constellation/Project-Constellation-Research-Suggestions.json
          EOF
          sha256sum -c /tmp/expected.sha256
          test "$(wc -c < project-constellation/Bert_Project_Second_Brain_Website.zip)" -eq 144481
          test "$(wc -c < project-constellation/Bert_Project_Constellation_Quick_View.html)" -eq 128283
          test "$(wc -c < project-constellation/Bert_Project_Constellation_Recovery_Command_Center_Full_Wiki.html)" -eq 143064
          test "$(wc -c < project-constellation/Bert_Project_Wiki_Pack.zip)" -eq 183831
          test "$(wc -c < project-constellation/Project-Constellation-Project-Catalog.json)" -eq 116737
          test "$(wc -c < project-constellation/Project-Constellation-Research-Suggestions.json)" -eq 13295
