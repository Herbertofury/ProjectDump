name: Issue-triggered GitHub Wiki recovery

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[recovery] sync ProjectDump wiki'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dispatch Wiki publisher and wait
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow='sync-github-wiki.yml'
          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
          run_id=''
          for _ in $(seq 1 60); do
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$candidate" != '0' && "$candidate" != "$before" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify Wiki publication status on current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/status" --jq '.statuses[] | select(.context == "wiki-publication") | .state' | head -n 1)"
          test "$state" = 'success'

      - name: Record issue recovery success
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --comment 'GitHub Wiki recovery dispatch completed and current-main wiki-publication status verified.'
