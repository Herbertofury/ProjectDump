name: Async 1.20.1 Forge GPU Config Persistence

on:
  push:
    branches: [async-1.20.1-ultimate-runtime-fixture]
    paths: [.github/workflows/async-1.20.1-runtime-fixture.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  persistence:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact diagnostic sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download exact proven parent JAR and merged source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reused source evidence config-classes patched
          gh run download 34066031095 \
            --repo Herbertofury/ProjectDump \
            --name async-1.20.1-ultimate-release-candidate \
            --dir reused
          base_jar="$(find reused -type f -name 'HariMultiThread-Ultimate-1.20.1-2.1.0-noxviola.1.jar' -print -quit)"
          source_zip="$(find reused -type f -name 'HariMultiThread-Ultimate-1.20.1-2.1.0-noxviola.1-SOURCE.zip' -print -quit)"
          test -s "$base_jar"
          test -s "$source_zip"
          test "$(sha256sum "$base_jar" | awk '{print $1}')" = "e6e9a51cc7ba77553cdcc41d6ca1f2d69c408afa0110e857ba436d55e75fad55"
          echo "$base_jar" > BASE_JAR_PATH.txt
          unzip -q "$source_zip" -d source
          sha256sum "$base_jar" | tee evidence/base-parent-jar.sha256

      - name: Patch only the missing Forge GPU config bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('source/forge/src/main/java/com/axalotl/async/forge/config/AsyncConfigForge.java')
          t = p.read_text(encoding='utf-8')

          replacements = [
              (
                  '        private static final ForgeConfigSpec.ConfigValue<Boolean> enableCircuitBreakerLocal;\n',
                  '        private static final ForgeConfigSpec.ConfigValue<Boolean> enableCircuitBreakerLocal;\n'
                  '        private static final ForgeConfigSpec.ConfigValue<Boolean> enableGpuCollisionLocal;\n'
              ),
              (
                  '''                enableCircuitBreakerLocal = BUILDER.comment("""\n                                Enable circuit breaker for entity tick crash isolation.\n                                When an entity type crashes repeatedly during async tick, it is automatically\n                                moved to synchronous ticking until it stabilizes. Prevents cascade failures.""")\n                                .define("enableCircuitBreaker", enableCircuitBreaker.getValue());\n\n''',
                  '''                enableCircuitBreakerLocal = BUILDER.comment("""\n                                Enable circuit breaker for entity tick crash isolation.\n                                When an entity type crashes repeatedly during async tick, it is automatically\n                                moved to synchronous ticking until it stabilizes. Prevents cascade failures.""")\n                                .define("enableCircuitBreaker", enableCircuitBreaker.getValue());\n\n                enableGpuCollisionLocal = BUILDER.comment(\n                                "Enable Vulkan broad-phase acceleration for deferred entity push queries. " +\n                                "When disabled or unavailable, vanilla collision lookup remains authoritative.")\n                                .define("enableGpuCollision", enableGpuCollision.getValue());\n\n'''
              ),
              (
                  '                enableCircuitBreaker.setValue(enableCircuitBreakerLocal.get());\n',
                  '                enableCircuitBreaker.setValue(enableCircuitBreakerLocal.get());\n'
                  '                enableGpuCollision.setValue(enableGpuCollisionLocal.get());\n'
              ),
              (
                  '                enableCircuitBreakerLocal.set(enableCircuitBreaker.getValue());\n',
                  '                enableCircuitBreakerLocal.set(enableCircuitBreaker.getValue());\n'
                  '                enableGpuCollisionLocal.set(enableGpuCollision.getValue());\n'
              ),
          ]
          for old, new in replacements:
              if t.count(old) != 1:
                  raise SystemExit(f'AsyncConfigForge source drift for marker: {old[:100]!r}')
              t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY
          grep -F 'enableGpuCollisionLocal' source/forge/src/main/java/com/axalotl/async/forge/config/AsyncConfigForge.java
          grep -F '.define("enableGpuCollision", enableGpuCollision.getValue())' source/forge/src/main/java/com/axalotl/async/forge/config/AsyncConfigForge.java

      - name: Install real Forge 47.4.23 server
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
          mkdir -p qa-server/mods
          curl -fL --retry 3 \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar' \
            -o forge-1.20.1-47.4.23-installer.jar
          (
            cd qa-server
            java -jar ../forge-1.20.1-47.4.23-installer.jar --installServer \
              > ../evidence/forge-server-install.log 2>&1
          )
          chmod +x qa-server/run.sh
          printf 'eula=true\n' > qa-server/eula.txt
          cat > qa-server/server.properties <<'EOF'
          online-mode=false
          level-name=world
          level-seed=8675309
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          motd=HariMultiThread GPU Config Persistence QA
          EOF

      - name: Compile and inject only AsyncConfigForge
        shell: bash
        run: |
          base_jar="$(cat BASE_JAR_PATH.txt)"
          forge_cp="$(find qa-server/libraries -type f -name '*.jar' -print | paste -sd: -)"
          javac --release 17 \
            -cp "$base_jar:$forge_cp" \
            -d config-classes \
            source/forge/src/main/java/com/axalotl/async/forge/config/AsyncConfigForge.java
          test -s config-classes/com/axalotl/async/forge/config/AsyncConfigForge.class
          javap -classpath config-classes -c -p com.axalotl.async.forge.config.AsyncConfigForge \
            > evidence/AsyncConfigForge.fixed.javap.txt
          grep -F 'enableGpuCollisionLocal' evidence/AsyncConfigForge.fixed.javap.txt
          grep -F 'enableGpuCollision' evidence/AsyncConfigForge.fixed.javap.txt

          patched_jar=patched/HariMultiThread-Ultimate-gpu-config-persistence.jar
          cp "$base_jar" "$patched_jar"
          jar uf "$patched_jar" -C config-classes com/axalotl/async/forge/config/AsyncConfigForge.class
          echo "$patched_jar" > PATCHED_JAR_PATH.txt
          cp "$patched_jar" qa-server/mods/HariMultiThread-Ultimate.jar
          sha256sum "$patched_jar" | tee evidence/patched-parent-jar.sha256

      - name: Prove GPU toggle survives a clean JVM restart
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import queue
          import subprocess
          import threading
          import time
          from pathlib import Path

          root = Path('qa-server')
          evidence = Path('evidence')
          env = os.environ.copy()
          env['JDK_JAVA_OPTIONS'] = (
              env.get('JDK_JAVA_OPTIONS', '') + ' -Dharimt.vulkan.allowCpuDevice=true'
          ).strip()

          fatal = ('MixinApplyError', 'InvalidMixinException', 'InjectionError',
                   'Exception in server tick loop', 'OutOfMemoryError',
                   'A fatal error has been detected by the Java Runtime Environment')

          def run_phase(name, actions):
              lines = []
              q = queue.Queue()
              p = subprocess.Popen(
                  ['bash', 'run.sh', 'nogui'], cwd=root,
                  stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT, text=True, bufsize=1, env=env)
              assert p.stdin and p.stdout

              def reader():
                  for line in p.stdout:
                      print(line, end='', flush=True)
                      lines.append(line)
                      q.put(line)

              t = threading.Thread(target=reader, daemon=True)
              t.start()

              def send(cmd):
                  print('[CONFIG-QA] >', cmd, flush=True)
                  p.stdin.write(cmd + '\n')
                  p.stdin.flush()

              def wait_for(marker, timeout):
                  deadline = time.monotonic() + timeout
                  while time.monotonic() < deadline:
                      for line in list(lines):
                          if any(x in line for x in fatal):
                              raise RuntimeError(f'fatal runtime marker while waiting for {marker!r}: {line.strip()}')
                          if marker in line:
                              return
                      if p.poll() is not None:
                          raise RuntimeError(f'server exited while waiting for {marker!r}')
                      try:
                          q.get(timeout=0.25)
                      except queue.Empty:
                          pass
                  raise TimeoutError(f'timed out waiting for {marker!r}')

              try:
                  wait_for('Done (', 180)
                  actions(send, wait_for)
                  send('stop')
                  rc = p.wait(timeout=60)
                  t.join(timeout=5)
                  if rc != 0:
                      raise RuntimeError(f'{name} server exit={rc}')
                  if 'Stopping server' not in ''.join(lines):
                      raise RuntimeError(f'{name} missing clean shutdown marker')
              finally:
                  if p.poll() is None:
                      p.terminate()
                      try:
                          p.wait(timeout=15)
                      except subprocess.TimeoutExpired:
                          p.kill(); p.wait(timeout=10)
                  t.join(timeout=5)
                  (evidence / f'{name}.log').write_text(''.join(lines), encoding='utf-8')

          def disable(send, wait_for):
              send('async gpu')
              wait_for('GPU Collision: Enabled', 30)
              send('async gpu toggle')
              wait_for('GPU Collision: Disabled', 30)

          run_phase('gpu-config-disable', disable)

          config_files = list((root / 'config').glob('*.toml'))
          matches = []
          for p in config_files:
              text = p.read_text(encoding='utf-8', errors='replace')
              if 'enableGpuCollision' in text:
                  matches.append((p, text))
          if len(matches) != 1:
              raise RuntimeError(f'expected one Forge config containing enableGpuCollision, found {len(matches)}')
          config_path, config_text = matches[0]
          if 'enableGpuCollision = false' not in config_text:
              raise RuntimeError(f'persisted Forge config did not contain enableGpuCollision = false: {config_path}')
          (evidence / 'gpu-config-path.txt').write_text(str(config_path) + '\n', encoding='utf-8')
          (evidence / 'gpu-config-after-disable.toml').write_text(config_text, encoding='utf-8')
          print('[CONFIG-QA] persisted false in', config_path, flush=True)

          def verify_restart(send, wait_for):
              send('async gpu')
              wait_for('GPU Collision: Disabled', 30)

          run_phase('gpu-config-restart', verify_restart)
          print('[CONFIG-QA] FORGE_GPU_CONFIG_PERSISTENCE_PASS', flush=True)
          PY
          grep -F 'FORGE_GPU_CONFIG_PERSISTENCE_PASS' evidence/gpu-config-restart.log >/dev/null 2>&1 || \
            test -f evidence/gpu-config-after-disable.toml
          grep -F 'enableGpuCollision = false' evidence/gpu-config-after-disable.toml
          grep -F 'GPU Collision: Disabled' evidence/gpu-config-restart.log

      - name: Upload persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-forge-gpu-config-persistence-evidence
          path: |
            evidence/
            patched/HariMultiThread-Ultimate-gpu-config-persistence.jar
          if-no-files-found: warn
