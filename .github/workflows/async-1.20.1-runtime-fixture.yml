name: Async 1.20.1 Vulkan Backend Diagnostic

on:
  push:
    branches: [async-1.20.1-ultimate-runtime-fixture]
    paths: [.github/workflows/async-1.20.1-runtime-fixture.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  backend-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Vulkan runtime
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools zip unzip
          mkdir -p evidence/runtime
          vulkaninfo --summary | tee evidence/runtime/vulkaninfo-summary.txt

      - name: Download exact proven parent JAR and merged source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reused patched-source patched
          gh run download 34066031095 \
            --repo Herbertofury/ProjectDump \
            --name async-1.20.1-ultimate-release-candidate \
            --dir reused
          base_jar="$(find reused -type f -name 'HariMultiThread-Ultimate-1.20.1-2.1.0-noxviola.1.jar' -print -quit)"
          source_zip="$(find reused -type f -name 'HariMultiThread-Ultimate-1.20.1-2.1.0-noxviola.1-SOURCE.zip' -print -quit)"
          test -s "$base_jar"
          test -s "$source_zip"
          echo "$base_jar" > BASE_JAR_PATH.txt
          echo "$source_zip" > SOURCE_ZIP_PATH.txt
          sha256sum "$base_jar" | tee evidence/runtime/base-parent-jar.sha256
          test "$(sha256sum "$base_jar" | awk '{print $1}')" = "e6e9a51cc7ba77553cdcc41d6ca1f2d69c408afa0110e857ba436d55e75fad55"
          unzip -q "$source_zip" -d patched-source
          test -s patched-source/vulkan-backend/src/main/java/com/axalotl/async/vulkanruntime/LwjglVulkanBackend.java

      - name: Apply only the proven device-to-host synchronization delta
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('patched-source/vulkan-backend/src/main/java/com/axalotl/async/vulkanruntime/LwjglVulkanBackend.java')
          t = p.read_text(encoding='utf-8')
          old = '''            vkCmdDispatch(commandBuffer, (count + 63) / 64, 1, 1);\n            check(vkEndCommandBuffer(commandBuffer), "vkEndCommandBuffer");\n'''
          new = '''            vkCmdDispatch(commandBuffer, (count + 63) / 64, 1, 1);\n\n            // A fence proves execution completion, but shader writes still need\n            // a device->host availability dependency before mapped host reads.\n            VkMemoryBarrier.Buffer hostReadBarrier = VkMemoryBarrier.calloc(1, stack);\n            hostReadBarrier.get(0)\n                    .sType(VK_STRUCTURE_TYPE_MEMORY_BARRIER)\n                    .srcAccessMask(VK_ACCESS_SHADER_WRITE_BIT)\n                    .dstAccessMask(VK_ACCESS_HOST_READ_BIT);\n            vkCmdPipelineBarrier(\n                    commandBuffer,\n                    VK_PIPELINE_STAGE_COMPUTE_SHADER_BIT,\n                    VK_PIPELINE_STAGE_HOST_BIT,\n                    0,\n                    hostReadBarrier,\n                    null,\n                    null);\n            check(vkEndCommandBuffer(commandBuffer), "vkEndCommandBuffer");\n'''
          if t.count(old) != 1:
              raise SystemExit(f'backend dispatch source drift: expected 1 marker, found {t.count(old)}')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F 'VK_PIPELINE_STAGE_HOST_BIT' patched-source/vulkan-backend/src/main/java/com/axalotl/async/vulkanruntime/LwjglVulkanBackend.java
          grep -F 'VK_ACCESS_HOST_READ_BIT' patched-source/vulkan-backend/src/main/java/com/axalotl/async/vulkanruntime/LwjglVulkanBackend.java

      - name: Rebuild only the isolated child backend and inject it into the proven parent JAR
        shell: bash
        run: |
          base_jar="$(cat BASE_JAR_PATH.txt)"
          mkdir -p deps backend-classes inject/META-INF/harimt-libs
          unzip -p "$base_jar" META-INF/harimt-libs/lwjgl-3.3.1.jar > deps/lwjgl-3.3.1.jar
          unzip -p "$base_jar" META-INF/harimt-libs/lwjgl-vulkan-3.3.1.jar > deps/lwjgl-vulkan-3.3.1.jar
          test -s deps/lwjgl-3.3.1.jar
          test -s deps/lwjgl-vulkan-3.3.1.jar

          javac --release 17 \
            -cp "$base_jar:deps/lwjgl-3.3.1.jar:deps/lwjgl-vulkan-3.3.1.jar" \
            -d backend-classes \
            patched-source/vulkan-backend/src/main/java/com/axalotl/async/vulkanruntime/LwjglVulkanBackend.java

          test -s backend-classes/com/axalotl/async/vulkanruntime/LwjglVulkanBackend.class
          javap -classpath backend-classes -c -p com.axalotl.async.vulkanruntime.LwjglVulkanBackend \
            > evidence/runtime/LwjglVulkanBackend.javap.txt
          grep -F 'vkCmdPipelineBarrier' evidence/runtime/LwjglVulkanBackend.javap.txt

          cat > backend-manifest.mf <<'EOF'
          Manifest-Version: 1.0
          Implementation-Title: HariMultiThread Ultimate Vulkan Backend
          Implementation-Version: 3.3.1
          EOF
          jar cfm patched/harimt-vulkan-backend-3.3.1.jar backend-manifest.mf -C backend-classes .
          cp patched/harimt-vulkan-backend-3.3.1.jar inject/META-INF/harimt-libs/

          patched_jar=patched/HariMultiThread-Ultimate-host-sync-diagnostic.jar
          cp "$base_jar" "$patched_jar"
          jar uf "$patched_jar" -C inject META-INF/harimt-libs/harimt-vulkan-backend-3.3.1.jar
          echo "$patched_jar" > PATCHED_JAR_PATH.txt
          unzip -p "$patched_jar" META-INF/harimt-libs/harimt-vulkan-backend-3.3.1.jar \
            > /tmp/embedded-backend.jar
          javap -classpath /tmp/embedded-backend.jar -c -p com.axalotl.async.vulkanruntime.LwjglVulkanBackend \
            | grep -F 'vkCmdPipelineBarrier'
          sha256sum patched/harimt-vulkan-backend-3.3.1.jar "$patched_jar" \
            | tee evidence/runtime/patched-backend-and-parent.sha256

      - name: Install Forge 47.4.23 server
        shell: bash
        run: |
          mkdir -p qa-server/mods
          curl -fL --retry 3 \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar' \
            -o forge-1.20.1-47.4.23-installer.jar
          (
            cd qa-server
            java -jar ../forge-1.20.1-47.4.23-installer.jar --installServer \
              > ../evidence/runtime/forge-server-install.log 2>&1
          )
          chmod +x qa-server/run.sh
          cp "$(cat PATCHED_JAR_PATH.txt)" qa-server/mods/HariMultiThread-Ultimate.jar
          printf 'eula=true\n' > qa-server/eula.txt
          cat > qa-server/server.properties <<'EOF'
          online-mode=false
          level-name=world
          level-seed=8675309
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          motd=HariMultiThread Vulkan Host Sync Diagnostic
          EOF

      - name: Run full packaged correctness gate against patched child backend
        shell: bash
        run: |
          python3 -m py_compile minecraft/async-1.20.1-ultimate/runtime_server_qa.py
          python3 minecraft/async-1.20.1-ultimate/runtime_server_qa.py \
            qa-server evidence/runtime

      - name: Summarize decisive Vulkan and restart evidence
        if: always()
        shell: bash
        run: |
          grep -Eh 'Compile-checked Vulkan collision backend initialized|Vulkan broad-phase learned pair capacity|Vulkan push broad-phase sustained|Live GPU Verification PASS|Exact pairs:|GPU candidates:|Conservative extras:|GPU VERIFICATION FAILED|Vanilla push replay fallback is active|HMT_QA_RESTART_ENTITIES_PRESENT|packaged Forge dense-pair' \
            evidence/runtime/packaged-server-*.log 2>/dev/null || true

      - name: Upload backend/runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-vulkan-host-sync-evidence
          path: |
            evidence/runtime/
            patched/harimt-vulkan-backend-3.3.1.jar
            patched/HariMultiThread-Ultimate-host-sync-diagnostic.jar
          if-no-files-found: warn
