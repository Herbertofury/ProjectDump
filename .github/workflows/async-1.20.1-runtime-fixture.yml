name: Async 1.20.1 Vulkan Micro Probe

on:
  push:
    branches: [async-1.20.1-ultimate-runtime-fixture]
    paths: [.github/workflows/async-1.20.1-runtime-fixture.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  micro-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Vulkan and shader tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools glslang-tools spirv-tools unzip
          mkdir -p evidence
          vulkaninfo --summary | tee evidence/vulkaninfo-summary.txt

      - name: Download exact proven parent JAR and source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reused source deps classes shaders
          gh run download 34066031095 \
            --repo Herbertofury/ProjectDump \
            --name async-1.20.1-ultimate-release-candidate \
            --dir reused
          base_jar="$(find reused -type f -name 'HariMultiThread-Ultimate-1.20.1-2.1.0-noxviola.1.jar' -print -quit)"
          source_zip="$(find reused -type f -name 'HariMultiThread-Ultimate-1.20.1-2.1.0-noxviola.1-SOURCE.zip' -print -quit)"
          test -s "$base_jar"
          test -s "$source_zip"
          test "$(sha256sum "$base_jar" | awk '{print $1}')" = "e6e9a51cc7ba77553cdcc41d6ca1f2d69c408afa0110e857ba436d55e75fad55"
          echo "$base_jar" > BASE_JAR_PATH.txt
          unzip -q "$source_zip" -d source
          unzip -p "$base_jar" META-INF/harimt-libs/lwjgl-3.3.1.jar > deps/lwjgl-3.3.1.jar
          unzip -p "$base_jar" META-INF/harimt-libs/lwjgl-vulkan-3.3.1.jar > deps/lwjgl-vulkan-3.3.1.jar
          unzip -p "$base_jar" META-INF/harimt-libs/lwjgl-3.3.1-natives-linux.jar > deps/lwjgl-3.3.1-natives-linux.jar
          test -s deps/lwjgl-3.3.1.jar
          test -s deps/lwjgl-vulkan-3.3.1.jar
          test -s deps/lwjgl-3.3.1-natives-linux.jar

      - name: Fix descriptor write count and compute-to-host availability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/vulkan-backend/src/main/java/com/axalotl/async/vulkanruntime/LwjglVulkanBackend.java')
          t = p.read_text(encoding='utf-8')

          old = '''                writes.get(i)\n                        .sType(VK_STRUCTURE_TYPE_WRITE_DESCRIPTOR_SET)\n                        .dstSet(descriptorSet)\n                        .dstBinding(i)\n                        .descriptorType(VK_DESCRIPTOR_TYPE_STORAGE_BUFFER)\n                        .pBufferInfo(VkDescriptorBufferInfo.create(infos.get(i).address(), 1));\n'''
          new = '''                writes.get(i)\n                        .sType(VK_STRUCTURE_TYPE_WRITE_DESCRIPTOR_SET)\n                        .dstSet(descriptorSet)\n                        .dstBinding(i)\n                        .descriptorCount(1)\n                        .descriptorType(VK_DESCRIPTOR_TYPE_STORAGE_BUFFER)\n                        .pBufferInfo(VkDescriptorBufferInfo.create(infos.get(i).address(), 1));\n'''
          if t.count(old) != 1:
              raise SystemExit(f'descriptor source drift: expected 1 marker, found {t.count(old)}')
          t = t.replace(old, new, 1)

          old = '''            vkCmdDispatch(commandBuffer, (count + 63) / 64, 1, 1);\n            check(vkEndCommandBuffer(commandBuffer), "vkEndCommandBuffer");\n'''
          new = '''            vkCmdDispatch(commandBuffer, (count + 63) / 64, 1, 1);\n\n            VkMemoryBarrier.Buffer hostReadBarrier = VkMemoryBarrier.calloc(1, stack);\n            hostReadBarrier.get(0)\n                    .sType(VK_STRUCTURE_TYPE_MEMORY_BARRIER)\n                    .srcAccessMask(VK_ACCESS_SHADER_WRITE_BIT)\n                    .dstAccessMask(VK_ACCESS_HOST_READ_BIT);\n            vkCmdPipelineBarrier(\n                    commandBuffer,\n                    VK_PIPELINE_STAGE_COMPUTE_SHADER_BIT,\n                    VK_PIPELINE_STAGE_HOST_BIT,\n                    0,\n                    hostReadBarrier,\n                    null,\n                    null);\n            check(vkEndCommandBuffer(commandBuffer), "vkEndCommandBuffer");\n'''
          if t.count(old) != 1:
              raise SystemExit(f'backend dispatch source drift: expected 1 marker, found {t.count(old)}')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F '.descriptorCount(1)' source/vulkan-backend/src/main/java/com/axalotl/async/vulkanruntime/LwjglVulkanBackend.java

      - name: Compile isolated backend and standalone probe
        shell: bash
        run: |
          base_jar="$(cat BASE_JAR_PATH.txt)"
          cp="${base_jar}:deps/lwjgl-3.3.1.jar:deps/lwjgl-vulkan-3.3.1.jar"
          javac --release 17 -cp "$cp" -d classes \
            source/vulkan-backend/src/main/java/com/axalotl/async/vulkanruntime/LwjglVulkanBackend.java \
            minecraft/async-1.20.1-ultimate/diagnostics/VulkanBackendProbe.java
          javap -classpath classes -c -p com.axalotl.async.vulkanruntime.LwjglVulkanBackend \
            > evidence/LwjglVulkanBackend.javap.txt
          grep -F 'vkCmdPipelineBarrier' evidence/LwjglVulkanBackend.javap.txt
          grep -F 'descriptorCount' evidence/LwjglVulkanBackend.javap.txt

      - name: Compile sentinel, push-constant, and AABB shaders
        shell: bash
        run: |
          cat > shaders/sentinel.comp <<'EOF'
          #version 450
          layout(local_size_x = 1) in;
          layout(std430, binding = 6) writeonly buffer PairsA { int pairsA[]; };
          layout(std430, binding = 7) writeonly buffer PairsB { int pairsB[]; };
          layout(std430, binding = 8) coherent buffer PairCount { int pairCounter; };
          void main() {
              if (gl_GlobalInvocationID.x == 0u) {
                  pairsA[0] = 0;
                  pairsB[0] = 1;
                  pairCounter = 1;
              }
          }
          EOF

          cat > shaders/push.comp <<'EOF'
          #version 450
          layout(local_size_x = 1) in;
          layout(push_constant) uniform PushConstants {
              int entityCount;
              int maxPairs;
              float reservedFloat;
              int reservedInt;
          };
          layout(std430, binding = 6) writeonly buffer PairsA { int pairsA[]; };
          layout(std430, binding = 7) writeonly buffer PairsB { int pairsB[]; };
          layout(std430, binding = 8) coherent buffer PairCount { int pairCounter; };
          void main() {
              if (gl_GlobalInvocationID.x == 0u && entityCount == 3 && maxPairs >= 1) {
                  pairsA[0] = 0;
                  pairsB[0] = 1;
                  pairCounter = 1;
              }
          }
          EOF

          cp minecraft/async-1.20.1-ultimate/diagnostics/global_memory_aabb_probe.comp shaders/aabb.comp

          for shader in sentinel push aabb; do
            glslangValidator -V "shaders/${shader}.comp" -o "shaders/${shader}.spv"
            spirv-val "shaders/${shader}.spv"
            test "$(xxd -p -l 4 "shaders/${shader}.spv")" = "03022307"
          done
          sha256sum shaders/*.spv | tee evidence/probe-shaders.sha256

      - name: Run sentinel output-descriptor/readback probe
        shell: bash
        run: |
          base_jar="$(cat BASE_JAR_PATH.txt)"
          cp="classes:${base_jar}:deps/lwjgl-3.3.1.jar:deps/lwjgl-vulkan-3.3.1.jar:deps/lwjgl-3.3.1-natives-linux.jar"
          java -cp "$cp" com.axalotl.async.vulkanruntime.VulkanBackendProbe shaders/sentinel.spv \
            | tee evidence/sentinel.txt
          grep -Fx 'VULKAN_BACKEND_PROBE_PASS' evidence/sentinel.txt

      - name: Run push-constant probe
        shell: bash
        run: |
          base_jar="$(cat BASE_JAR_PATH.txt)"
          cp="classes:${base_jar}:deps/lwjgl-3.3.1.jar:deps/lwjgl-vulkan-3.3.1.jar:deps/lwjgl-3.3.1-natives-linux.jar"
          java -cp "$cp" com.axalotl.async.vulkanruntime.VulkanBackendProbe shaders/push.spv \
            | tee evidence/push.txt
          grep -Fx 'VULKAN_BACKEND_PROBE_PASS' evidence/push.txt

      - name: Run global-memory AABB input probe
        shell: bash
        run: |
          base_jar="$(cat BASE_JAR_PATH.txt)"
          cp="classes:${base_jar}:deps/lwjgl-3.3.1.jar:deps/lwjgl-vulkan-3.3.1.jar:deps/lwjgl-3.3.1-natives-linux.jar"
          java -cp "$cp" com.axalotl.async.vulkanruntime.VulkanBackendProbe shaders/aabb.spv \
            | tee evidence/aabb.txt
          grep -Fx 'VULKAN_BACKEND_PROBE_PASS' evidence/aabb.txt

      - name: Upload micro-probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-vulkan-micro-probe-evidence
          path: |
            evidence/
            shaders/*.comp
            shaders/*.spv
          if-no-files-found: error
