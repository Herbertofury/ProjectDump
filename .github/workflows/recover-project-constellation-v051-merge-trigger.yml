name: Recover Project Constellation v0.5.1 via merge trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-project-constellation-v051-merge-trigger.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/recover-project-constellation-v051-merge-trigger.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dispatch deterministic publisher and wait for a fresh run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow='recover-project-constellation-v051-deterministic.yml'
          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
          run_id=''
          for _ in $(seq 1 60); do
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$candidate" != '0' && "$candidate" != "$before" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo 'A new deterministic publication run was not observable after dispatch.' >&2
            exit 70
          fi
          echo "Watching deterministic publication run $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Independently verify all six canonical GitHub objects and promoted state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/v051-remote"
          rm -rf "$work"
          mkdir -p "$work"

          fetch_file() {
            local path="$1"
            local output="$2"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.content' | tr -d '\n' | base64 --decode > "$output"
          }
          expect_blob() {
            local path="$1"
            local expected="$2"
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha')"
            test "$actual" = "$expected"
          }

          fetch_file 'project-constellation/Bert_Project_Second_Brain_Website.zip' "$work/Bert_Project_Second_Brain_Website.zip"
          fetch_file 'project-constellation/Bert_Project_Constellation_Quick_View.html' "$work/Bert_Project_Constellation_Quick_View.html"
          fetch_file 'project-constellation/Bert_Project_Constellation_Recovery_Command_Center_Full_Wiki.html' "$work/Bert_Project_Constellation_Recovery_Command_Center_Full_Wiki.html"
          fetch_file 'project-constellation/Bert_Project_Wiki_Pack.zip' "$work/Bert_Project_Wiki_Pack.zip"
          fetch_file 'project-constellation/Project-Constellation-Project-Catalog.json' "$work/Project-Constellation-Project-Catalog.json"
          fetch_file 'project-constellation/Project-Constellation-Research-Suggestions.json' "$work/Project-Constellation-Research-Suggestions.json"

          expect_blob 'project-constellation/Bert_Project_Second_Brain_Website.zip' 'e90cab98efa9ede0c0aed76ae36487b1a781c12f'
          expect_blob 'project-constellation/Bert_Project_Constellation_Quick_View.html' '98853d70caa3d737123151d4db23dba51861d665'
          expect_blob 'project-constellation/Bert_Project_Constellation_Recovery_Command_Center_Full_Wiki.html' 'f45fdf93257cb6cdc991c2752b77d6d4de109921'
          expect_blob 'project-constellation/Bert_Project_Wiki_Pack.zip' 'b190e2199474b1d6d48c202314f7f681ec3ff15b'
          expect_blob 'project-constellation/Project-Constellation-Project-Catalog.json' '0cbd23ef565c5ea61c26c978142d2b1f434c6bbf'
          expect_blob 'project-constellation/Project-Constellation-Research-Suggestions.json' '9eb5efa43ab811ac0c0e175606c552cfd95d4b6e'

          cat > "$work/expected.sha256" <<'EOF'
          f49eb085c230da9ea2c62b2d4e91770be0b2638bf47a188fa43f6ff2b537893c  Bert_Project_Second_Brain_Website.zip
          8234e889c6b8cae67158c3cec525e3607bb8403173cf095e80c1b7ffd597ffe1  Bert_Project_Constellation_Quick_View.html
          dd1f852bf4f7d677d3a499a7238359dff55aa6a3bc3f338c534dca2c89faa1a8  Bert_Project_Constellation_Recovery_Command_Center_Full_Wiki.html
          9be52cefe088ef3b4dbdac906073c21f3b48c4265f25bff02aec5a0010163891  Bert_Project_Wiki_Pack.zip
          79c43dde274c7e4420a27d35ff58fdea4b7bdfc4c5cc412ad527c995eb8977ab  Project-Constellation-Project-Catalog.json
          c20f76e5eba87a21769dfe582ce8690e0b3dc62570e05ea8e5be87b9a610cac6  Project-Constellation-Research-Suggestions.json
          EOF
          cd "$work"
          sha256sum -c expected.sha256
          test "$(wc -c < Bert_Project_Second_Brain_Website.zip)" -eq 144481
          test "$(wc -c < Bert_Project_Constellation_Quick_View.html)" -eq 128283
          test "$(wc -c < Bert_Project_Constellation_Recovery_Command_Center_Full_Wiki.html)" -eq 143064
          test "$(wc -c < Bert_Project_Wiki_Pack.zip)" -eq 183831
          test "$(wc -c < Project-Constellation-Project-Catalog.json)" -eq 116737
          test "$(wc -c < Project-Constellation-Research-Suggestions.json)" -eq 13295
          unzip -t Bert_Project_Second_Brain_Website.zip
          unzip -t Bert_Project_Wiki_Pack.zip
          jq -e '.projectCount == 63 and (.projects | length) == 63' Project-Constellation-Project-Catalog.json >/dev/null
          jq -e . Project-Constellation-Research-Suggestions.json >/dev/null

          state="$(gh api "repos/${GITHUB_REPOSITORY}/contents/project-constellation/Project-Constellation-Automation-State.json?ref=main" --jq '.content' | tr -d '\n' | base64 --decode)"
          debt="$(gh api "repos/${GITHUB_REPOSITORY}/contents/project-constellation/Project-Constellation-Publication-Debt.json?ref=main" --jq '.content' | tr -d '\n' | base64 --decode)"
          gate="$(gh api "repos/${GITHUB_REPOSITORY}/contents/project-constellation/publication-gate/v0.5.1.json?ref=main" --jq '.content' | tr -d '\n' | base64 --decode)"

          jq -e '.version == "0.5.1" and .lastAutomationHash["Bert_Project_Second_Brain_Website.zip"] == "f49eb085c230da9ea2c62b2d4e91770be0b2638bf47a188fa43f6ff2b537893c" and .lastAutomationHash["Bert_Project_Constellation_Quick_View.html"] == "8234e889c6b8cae67158c3cec525e3607bb8403173cf095e80c1b7ffd597ffe1" and .lastAutomationHash["Bert_Project_Constellation_Recovery_Command_Center_Full_Wiki.html"] == "dd1f852bf4f7d677d3a499a7238359dff55aa6a3bc3f338c534dca2c89faa1a8" and .lastAutomationHash["Bert_Project_Wiki_Pack.zip"] == "9be52cefe088ef3b4dbdac906073c21f3b48c4265f25bff02aec5a0010163891" and .lastAutomationHash["Project-Constellation-Project-Catalog.json"] == "79c43dde274c7e4420a27d35ff58fdea4b7bdfc4c5cc412ad527c995eb8977ab" and .lastAutomationHash["Project-Constellation-Research-Suggestions.json"] == "c20f76e5eba87a21769dfe582ce8690e0b3dc62570e05ea8e5be87b9a610cac6"' <<<"$state" >/dev/null
          jq -e '.status == "VERIFIED_CLEARED" and .canonicalPromotion.githubPerformed == true' <<<"$debt" >/dev/null
          jq -e '.status == "VERIFIED_PUBLISHED"' <<<"$gate" >/dev/null

# Recovery-watch observable retrigger after browser-gate source repair
