name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wikis/**'
      - 'tools/github-wiki/**'
      - '.github/workflows/sync-github-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: github-wiki-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Publish and verify wiki
        id: wiki
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          bash tools/github-wiki/wiki-sync.sh "${{ github.repository }}" wikis "${{ github.server_url }}" | tee "$log_file"
          wiki_commit="$(awk '/^Wiki master commit: / {print $4}' "$log_file" | tail -n 1)"
          if [[ ! "$wiki_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Publisher completed without a valid Wiki master commit." >&2
            exit 71
          fi
          echo "wiki_commit=$wiki_commit" >> "$GITHUB_OUTPUT"

      - name: Record verified publication status
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_COMMIT: ${{ steps.wiki.outputs.wiki_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=wiki-publication \
            -f description="fresh-clone byte-verified wiki ${WIKI_COMMIT}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Record publication failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=wiki-publication \
            -f description="GitHub Wiki publish or fresh-clone verification failed" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
