name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wikis/**'
      - 'tools/github-wiki/**'
      - '.github/workflows/sync-github-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: github-wiki-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup-retired-references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scrub current tree, restore normal workflow, validate, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Project Constellation Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          sync_workflow = Path('.github/workflows/sync-github-wiki.yml')
          unused_workflow = Path('.github/workflows/cleanup-project-references.yml')
          target = 'Sports Group Hub'
          drop_keys = {'removedProjectAbsent'}

          clause_patterns = [
              r'\s*(?:,|;)?\s*(?:and|with)?\s*Sports Group Hub\s+remains\s+removed\s+and\s+must\s+never\s+be\s+re-added\.?',
              r'\s*(?:,|;)?\s*(?:and|with)?\s*Sports Group Hub\s+remains\s+(?:removed|excluded|absent)\.?',
              r'\s*(?:,|;)?\s*(?:and|with)?\s*Sports Group Hub\s+(?:is\s+)?(?:removed|excluded|absent)\.?',
              r'\s*(?:,|;)?\s*(?:and|with)?\s*Sports Group Hub\s+(?:absence|exclusion)\b',
              r'\s*(?:,|;)?\s*never\s+re-add\s+Sports Group Hub(?:\s+unless\s+[^.;\n]+)?[.;]?',
              r'\s*(?:,|;)?\s*and\s+never\s+re-add\s+Sports Group Hub\.?',
              r'\s*(?:,|;)?\s*Sports Group Hub\s*:\s*absent\b',
              r'\s*(?:,|;)?\s*Sports Group Hub\s+absent\s*:\s*true\b',
          ]

          def clean_string(value: str) -> str:
              s = value
              for pat in clause_patterns:
                  s = re.sub(pat, '', s, flags=re.IGNORECASE)
              s = re.sub(r'\bSports Group Hub\b', '', s, flags=re.IGNORECASE)
              s = re.sub(r'\bsportsGroupHub[A-Za-z0-9_]*\b', '', s)
              s = s.replace('removedProjectAbsent', '')
              s = re.sub(r'\b(?:forbidden|excluded|removed)-project absence\b', '', s, flags=re.IGNORECASE)
              s = re.sub(r'\s+,', ',', s)
              s = re.sub(r',\s*,+', ',', s)
              s = re.sub(r';\s*;', ';', s)
              s = re.sub(r'\s+\.', '.', s)
              s = re.sub(r'\s+;', ';', s)
              s = re.sub(r'\s{2,}', ' ', s)
              s = re.sub(r'(?m)^\s*[-*]\s*$\n?', '', s)
              s = re.sub(r'(?m)^\s*[,;.]\s*$\n?', '', s)
              return s.strip() if '\n' not in value else s

          def clean_obj(obj):
              if isinstance(obj, dict):
                  out = {}
                  for key, val in obj.items():
                      if key in drop_keys or key.lower().startswith('sportsgrouphub'):
                          continue
                      out[key] = clean_obj(val)
                  return out
              if isinstance(obj, list):
                  out = []
                  for item in obj:
                      if isinstance(item, dict) and str(item.get('name', '')).strip().lower() == target.lower():
                          continue
                      out.append(clean_obj(item))
                  return out
              if isinstance(obj, str):
                  return clean_string(obj)
              return obj

          changed = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts or path in {sync_workflow, unused_workflow}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              if path.suffix.lower() == '.json':
                  try:
                      obj = json.loads(text)
                  except json.JSONDecodeError:
                      continue
                  obj = clean_obj(obj)
                  text = json.dumps(obj, ensure_ascii=False, indent=2) + '\n'
              else:
                  text = clean_string(text)
                  text = re.sub(r'(?m)^.*\bsportsGroupHub[A-Za-z0-9_]*\b.*\n?', '', text)
                  text = re.sub(r'(?m)^.*\bremovedProjectAbsent\b.*\n?', '', text)
                  text = re.sub(r'\n{3,}', '\n\n', text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Prepared {len(changed)} content changes before workflow restoration')
          PY

          # Restore the normal Wiki Sync workflow from the parent commit and remove the unused one-shot file.
          git show HEAD^:.github/workflows/sync-github-wiki.yml > .github/workflows/sync-github-wiki.yml
          rm -f .github/workflows/cleanup-project-references.yml

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          for path in sorted(root.rglob('*.json')):
              if '.git' in path.parts:
                  continue
              json.loads(path.read_text(encoding='utf-8'))

          catalog = json.loads(Path('project-constellation/Project-Constellation-Project-Catalog.json').read_text(encoding='utf-8'))
          projects = catalog.get('projects', [])
          assert catalog.get('projectCount') == 63, catalog.get('projectCount')
          assert len(projects) == 63, len(projects)
          assert len({p.get('id') for p in projects}) == 63

          forbidden = re.compile(r'Sports Group Hub|sportsGroupHub[A-Za-z0-9_]*|removedProjectAbsent|(?:forbidden|excluded|removed)-project absence', re.I)
          leftovers = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if forbidden.search(text):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Retired-project references remain:\n' + '\n'.join(leftovers))

          print('Validation passed: 63 unique project records and zero retired-project references in current UTF-8 tree')
          PY

          git add -A
          git diff --cached --check
          git commit -m "chore: remove retired project references"
          git pull --rebase origin main
          git push origin HEAD:main

  sync:
    needs: cleanup-retired-references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleaned source repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish and verify wiki
        id: wiki
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          bash tools/github-wiki/wiki-sync.sh "${{ github.repository }}" wikis "${{ github.server_url }}" | tee "$log_file"
          wiki_commit="$(awk '/^Wiki master commit: / {print $4}' "$log_file" | tail -n 1)"
          if [[ ! "$wiki_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Publisher completed without a valid Wiki master commit." >&2
            exit 71
          fi
          echo "wiki_commit=$wiki_commit" >> "$GITHUB_OUTPUT"

      - name: Record verified publication status
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_COMMIT: ${{ steps.wiki.outputs.wiki_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=wiki-publication \
            -f description="fresh-clone byte-verified wiki ${WIKI_COMMIT}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Record publication failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=wiki-publication \
            -f description="GitHub Wiki publish or fresh-clone verification failed" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
