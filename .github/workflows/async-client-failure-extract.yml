name: Async Client Failure Extract

on:
  push:
    branches: [async-1.20.1-ultimate-runtime-fixture]
    paths: [.github/workflows/async-client-failure-extract.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Extract client failure from completed final job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            /repos/Herbertofury/ProjectDump/actions/jobs/101583487408/logs \
            > evidence/final-job.log
          test -s evidence/final-job.log

          awk '
            /Real Forge client and integrated-server gate/ {capture=1}
            capture {print}
          ' evidence/final-job.log > evidence/client-step.log
          test -s evidence/client-step.log

          grep -nEi \
            'HMT-CLIENT-QA|Traceback|RuntimeError|TimeoutError|GLFW|MixinApplyError|InvalidMixinException|InjectionError|Vulkan|Minecraft|Xvfb|openbox|xdotool|window|Process completed with exit code|BUILD FAILED|Exception' \
            evidence/client-step.log > evidence/client-causal-lines.txt || true
          tail -n 220 evidence/client-step.log > evidence/client-step-tail.txt

          echo '=== CLIENT CAUSAL LINES ==='
          tail -n 180 evidence/client-causal-lines.txt || true
          echo '=== CLIENT STEP TAIL ==='
          cat evidence/client-step-tail.txt

      - name: Upload compact client failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-client-failure-extract
          path: |
            evidence/client-causal-lines.txt
            evidence/client-step-tail.txt
          if-no-files-found: error
