name: Creeperella 1.3.0 Verify

on:
  push:
    branches:
      - build/creeperella-1.3.0
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/creeperella-1.3.0-build.yml'
      - 'projects/creeperella/ci/v1.3.0/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: Reconstruct exact Creeperella 1.3.0 compile source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/creeperella /tmp/creeperella.zip /tmp/creeperella.b64
          mkdir -p /tmp/creeperella
          test "$(wc -c < projects/creeperella/ci/v1.3.0/source.b64.part00)" -eq 15000
          test "$(wc -c < projects/creeperella/ci/v1.3.0/source.b64.part01)" -eq 15000
          test "$(wc -c < projects/creeperella/ci/v1.3.0/source.b64.part02)" -eq 15000
          test "$(wc -c < projects/creeperella/ci/v1.3.0/source.b64.part03)" -eq 2248
          cat projects/creeperella/ci/v1.3.0/source.b64.part00 \
              projects/creeperella/ci/v1.3.0/source.b64.part01 \
              projects/creeperella/ci/v1.3.0/source.b64.part02 \
              projects/creeperella/ci/v1.3.0/source.b64.part03 > /tmp/creeperella.b64
          test "$(wc -c < /tmp/creeperella.b64)" -eq 47248
          base64 -d /tmp/creeperella.b64 > /tmp/creeperella.zip
          echo 'bee3de0b0abf0a5b1f04cb9886bf5467f2ccc47cee7af3a51721044a2144d516  /tmp/creeperella.zip' | sha256sum -c -
          unzip -t /tmp/creeperella.zip
          unzip -q /tmp/creeperella.zip -d /tmp/creeperella
          cd /tmp/creeperella

          grep -q '^minecraft_version=1.20.1$' gradle.properties
          grep -q '^forge_version=47.4.23$' gradle.properties
          grep -q '^mod_version=1.3.0$' gradle.properties
          test -f src/main/java/dev/herbertofury/creeperella/config/CreeperellaClientConfig.java
          grep -q 'ModConfig.Type.CLIENT' src/main/java/dev/herbertofury/creeperella/Creeperella.java
          grep -q 'ItemProperties.register' src/main/java/dev/herbertofury/creeperella/client/ClientEvents.java
          grep -q 'spawn_egg_3d' src/main/java/dev/herbertofury/creeperella/client/ClientEvents.java
          grep -q 'spawn_egg_anim' src/main/java/dev/herbertofury/creeperella/client/ClientEvents.java
          grep -q 'use3DSpawnEggs' src/main/java/dev/herbertofury/creeperella/config/CreeperellaClientConfig.java
          grep -q 'animate3DSpawnEggs' src/main/java/dev/herbertofury/creeperella/config/CreeperellaClientConfig.java
          test "$(find src/main/java -name '*.java' | wc -l)" -eq 17

      - name: Compile, remap and build production JAR
        working-directory: /tmp/creeperella
        shell: bash
        run: |
          set -euo pipefail
          gradle build --no-daemon --stacktrace
          prod_jar="$(find build/libs -maxdepth 1 -type f -name '*-srg.jar' -print -quit)"
          test -n "$prod_jar"
          unzip -t "$prod_jar"
          sha256sum "$prod_jar" | tee build/libs/PRODUCTION-SHA256.txt

      - name: Real Forge dedicated-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/creeperella-server
          mkdir -p /tmp/creeperella-server/mods
          cd /tmp/creeperella-server
          curl -fL --retry 4 --retry-delay 2 -o forge-installer.jar 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar'
          echo 'ed31ce02ac69176f34353235cb2508d5a0f1e088  forge-installer.jar' | sha1sum -c -
          java -jar forge-installer.jar --installServer
          prod_jar="$(find /tmp/creeperella/build/libs -maxdepth 1 -type f -name '*-srg.jar' -print -quit)"
          cp "$prod_jar" mods/creeperella-1.3.0.jar
          echo 'eula=true' > eula.txt
          : > server.log
          setsid ./run.sh nogui > server.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 150); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' server.log; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat server.log
          test "$ready" -eq 1
          grep -Eiq 'creeperella|Bloom & Boom' server.log
          kill -TERM -- "-$pid" 2>/dev/null || true
          sleep 2
          kill -KILL -- "-$pid" 2>/dev/null || true

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creeperella-1.3.0-production-ci
          if-no-files-found: warn
          path: |
            /tmp/creeperella/build/libs/*-srg.jar
            /tmp/creeperella/build/libs/PRODUCTION-SHA256.txt
            /tmp/creeperella-server/server.log
