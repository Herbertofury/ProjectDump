name: Fetch SmartBrainLib for benchmark gate

on:
  push:
    branches:
      - benchmark/potatoptimize-midnight-dimthreads-c2me
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-sbl:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and verify exact SmartBrainLib 1.15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://cdn.modrinth.com/data/PuyPazRT/versions/YkeJNm33/SmartBrainLib-forge-1.20.1-1.15.jar' \
            --output out/SmartBrainLib-forge-1.20.1-1.15.jar
          sha256sum out/SmartBrainLib-forge-1.20.1-1.15.jar | tee out/SHA256SUMS.txt
          unzip -tq out/SmartBrainLib-forge-1.20.1-1.15.jar
      - name: Upload verified dependency
        uses: actions/upload-artifact@v4
        with:
          name: smartbrainlib-forge-1.20.1-1.15-verified
          path: |
            out/SmartBrainLib-forge-1.20.1-1.15.jar
            out/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
