name: Publish Potatoptimize Certified Assets Branch

on:
  push:
    paths:
      - '.github/workflows/potatoptimize-publish-certified-assets-branch.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: potatoptimize-certified-assets-r1
  cancel-in-progress: false

jobs:
  publish-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: c74675a97fd415f5fedbd168ba5553c0b55ad6c7
      RUNTIME_RUN: '34153631803'
      COMPAT_RUN: '34153631787'
      AGGRESSIVE_RUN: '34153631764'
      RELEASE_BRANCH: release/potatoptimize-forge-1.20.1-parity-safe-r1
      RELEASE_TAG: potatoptimize-forge-1.20.1-parity-safe-r1
      ASSET_DIR: release-assets/potatoptimize-forge-1.20.1-parity-safe-r1
      RELEASE_JAR: Potatoptimize-Forge-1.20.1-ParitySafe-r1.jar
      RELEASE_SOURCES: Potatoptimize-Forge-1.20.1-ParitySafe-r1-sources.jar
      CERTIFIED_SHA: 5292a29d99eb4f51ef130043b5189b316d8f9274c459a47c8c03a2e0408832c6
    steps:
      - name: Verify the three certified runs
        run: |
          set -euxo pipefail
          for RUN in "$RUNTIME_RUN" "$COMPAT_RUN" "$AGGRESSIVE_RUN"; do
            JSON=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}")
            test "$(jq -r .status <<<"$JSON")" = completed
            test "$(jq -r .conclusion <<<"$JSON")" = success
            test "$(jq -r .head_sha <<<"$JSON")" = "$SOURCE_SHA"
          done

      - name: Checkout release branch rooted at certified source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Download and freeze exact certified bytes
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          rm -rf /tmp/potato-runtime /tmp/potato-compat /tmp/potato-aggressive /tmp/potato-package "$ASSET_DIR"
          mkdir -p /tmp/potato-runtime /tmp/potato-compat /tmp/potato-aggressive /tmp/potato-package "$ASSET_DIR/evidence"

          gh run download "$RUNTIME_RUN" -R "$GITHUB_REPOSITORY" -n potatoptimize-forge-1.20.1-runtime-evidence-and-jar -D /tmp/potato-runtime
          gh run download "$COMPAT_RUN" -R "$GITHUB_REPOSITORY" -n potatoptimize-forge-1.20.1-compat-stack-evidence -D /tmp/potato-compat
          gh run download "$AGGRESSIVE_RUN" -R "$GITHUB_REPOSITORY" -n potatoptimize-forge-1.20.1-aggressive-profile-evidence -D /tmp/potato-aggressive

          JAR=$(find /tmp/potato-runtime -type f -name 'potatoptimize-forge-1.20.1-1.0.0.jar' | head -n 1)
          SOURCES=$(find /tmp/potato-runtime -type f -name 'potatoptimize-forge-1.20.1-1.0.0-sources.jar' | head -n 1)
          test -n "$JAR"
          test -n "$SOURCES"
          test "$(sha256sum "$JAR" | awk '{print $1}')" = "$CERTIFIED_SHA"

          SUMMARY=$(find /tmp/potato-aggressive -type f -name SWEEP-SUMMARY.txt | head -n 1)
          test -n "$SUMMARY"
          awk '
            /^=== FAMILY FAILURES ===$/ { section=1; next }
            /^=== INDIVIDUAL RULE FAILURES ===$/ { section=2; next }
            /^=== COMBINATION FAILURES ===$/ { section=3; next }
            NF && section { bad=1 }
            END { exit bad }
          ' "$SUMMARY"

          cp "$JAR" "$ASSET_DIR/$RELEASE_JAR"
          cp "$SOURCES" "$ASSET_DIR/$RELEASE_SOURCES"
          (cd /tmp/potato-runtime && zip -qr "$GITHUB_WORKSPACE/$ASSET_DIR/evidence/runtime-certification-evidence.zip" .)
          (cd /tmp/potato-compat && zip -qr "$GITHUB_WORKSPACE/$ASSET_DIR/evidence/performance-stack-certification-evidence.zip" .)
          (cd /tmp/potato-aggressive && zip -qr "$GITHUB_WORKSPACE/$ASSET_DIR/evidence/aggressive-profile-linkage-evidence.zip" .)

          cat > "$ASSET_DIR/RELEASE_NOTES.md" <<EOF
          # Potatoptimize Forge 1.20.1 - Parity-Safe Port r1

          Native Forge 1.20.1 production port targeting Forge 47.4.23 and Java 17.

          ## Vanilla-parity default profile
          Behavior-changing, RNG-sequence-changing, loading, threading, save, profiler-removal, unsafe-random, and other semantically risky optimizations are **OFF by default**.

          Enabled by default:
          - sign ticking optimization
          - packed-int/data-bit arithmetic optimization
          - nearest item/player sensor stream-removal optimization

          Everything else is explicit opt-in where available.

          ## Certification
          Source commit: \`$SOURCE_SHA\`

          Release JAR SHA-256: \`$CERTIFIED_SHA\`

          Passed:
          1. Production Runtime QA \`$RUNTIME_RUN\`: clean Forge 47.4.23 build/remap, gameplay/world exercise, save, clean shutdown, then second boot of the same world/config.
          2. Optimization Stack QA \`$COMPAT_RUN\`: ModernFix + ServerCore + FerriteCore + Krypton Reno/FNP with compatibility and Mixin/runtime assertions.
          3. Aggressive Profile QA \`$AGGRESSIVE_RUN\`: isolated server/common option families plus all-on challenge with zero family, individual-rule, or combination failures.

          The optional entity-ticking path was hardened for Forge: concurrent entity storage remains, while gameplay/world entity actions stay on Minecraft's authoritative tick thread to prevent chunk-system circular waits.

          Client-only experimental opt-ins remain OFF by default and are not claimed as dedicated-server certified.

          GPL-3.0 upstream licensing is preserved.
          EOF

          cat > "$ASSET_DIR/INSTALL.txt" <<'EOF'
          INSTALL
          1. Use Minecraft 1.20.1 with Forge 47.4.23 and Java 17.
          2. Put Potatoptimize-Forge-1.20.1-ParitySafe-r1.jar in the instance mods folder.
          3. First launch writes config/potatoptimize.properties.
          4. Leave defaults unchanged for the parity-safe profile.
          5. Experimental/behavior-changing options are opt-in. Back up the world before changing them.
          EOF

          cat > "$ASSET_DIR/SAFE-DEFAULTS.txt" <<'EOF'
          DEFAULT-ON RULES (exactly three)
          mixin.block_entity.sign_ticking = true
          mixin.logic.data_bits = true
          mixin.unstream.nearest_item = true

          Threading, RNG/random, world/save, startup/removal, navigation and other semantic-risk families remain OFF by default.
          EOF

          cat > "$ASSET_DIR/CERTIFICATION.txt" <<EOF
          POTATOPTIMIZE FORGE 1.20.1 PARITY-SAFE R1
          Status: RELEASE-READY / SERVER+COMMON CERTIFIED
          Source: $SOURCE_SHA
          JAR SHA-256: $CERTIFIED_SHA
          Runtime QA: $RUNTIME_RUN PASS
          Performance Stack QA: $COMPAT_RUN PASS
          Aggressive Profile QA: $AGGRESSIVE_RUN PASS
          Aggressive failures: 0 family / 0 rule / 0 combination
          Client-only experimental opt-ins are not claimed as dedicated-server certified.
          EOF

          printf '%s\n' "$SOURCE_SHA" > "$ASSET_DIR/SOURCE_COMMIT.txt"
          printf '%s\n' "$RUNTIME_RUN" > "$ASSET_DIR/RUNTIME_QA_RUN.txt"
          printf '%s\n' "$COMPAT_RUN" > "$ASSET_DIR/COMPAT_QA_RUN.txt"
          printf '%s\n' "$AGGRESSIVE_RUN" > "$ASSET_DIR/AGGRESSIVE_QA_RUN.txt"
          sha256sum "$ASSET_DIR/$RELEASE_JAR" "$ASSET_DIR/$RELEASE_SOURCES" "$ASSET_DIR"/evidence/*.zip | sed "s#$ASSET_DIR/##" > "$ASSET_DIR/SHA256SUMS.txt"

          cp -a "$ASSET_DIR/." /tmp/potato-package/
          (cd /tmp/potato-package && zip -qr "$GITHUB_WORKSPACE/$ASSET_DIR/Potatoptimize-Forge-1.20.1-ParitySafe-r1-Certified-Package.zip" .)
          sha256sum "$ASSET_DIR/Potatoptimize-Forge-1.20.1-ParitySafe-r1-Certified-Package.zip" > "$ASSET_DIR/PACKAGE-SHA256.txt"

      - name: Commit permanent GitHub release assets
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ASSET_DIR"
          git commit -m 'release: publish Potatoptimize Forge 1.20.1 parity-safe r1 certified assets'
          git push origin "HEAD:$RELEASE_BRANCH"

      - name: Tag exact certified source
        run: |
          set -euxo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_SHA"
          else
            git tag -a "$RELEASE_TAG" "$SOURCE_SHA" -m 'Potatoptimize Forge 1.20.1 - Parity-Safe r1'
            git push origin "refs/tags/$RELEASE_TAG"
          fi
