name: Creeperella 1.20.1 Verify

on:
  push:
    branches:
      - build/creeperella-1.20.1
      - build/creeperella-1.20.1-ci2
      - build/creeperella-1.2.0
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/creeperella-1.20.1-build.yml'
      - 'projects/creeperella/ci/v1.2.0/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'

      - name: Reconstruct and validate Creeperella 1.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/creeperella /tmp/creeperella.zip /tmp/creeperella.b64 /tmp/creeperella-hardening.patch
          mkdir -p /tmp/creeperella
          head -c 15000 projects/creeperella/ci/v1.2.0/source.b64.part00 > /tmp/creeperella.b64
          head -c 15000 projects/creeperella/ci/v1.2.0/source.b64.part01 >> /tmp/creeperella.b64
          head -c 3608 projects/creeperella/ci/v1.2.0/source.b64.part02 >> /tmp/creeperella.b64
          tr -d '\r\n' < /tmp/creeperella.b64 | base64 -d > /tmp/creeperella.zip
          echo '773bd723beacbdc6da3547442445a7c64765e0efa3a206aa620d484deec54fdc  /tmp/creeperella.zip' | sha256sum -c -
          unzip -t /tmp/creeperella.zip
          unzip -q /tmp/creeperella.zip -d /tmp/creeperella

          cp projects/creeperella/ci/v1.2.0/hardening-v2.patch /tmp/creeperella-hardening.patch
          echo '5346fa5886e574060991b0502cd3f43e9feba1a1c84973d9c3d9b24a2bcf6d54  /tmp/creeperella-hardening.patch' | sha256sum -c -
          cd /tmp/creeperella
          patch -p1 < /tmp/creeperella-hardening.patch

          echo '8d7abf0b325882cb9c5f48a06c84d4db1f9314843d6759c4f9c81e0aade08ad2  src/main/java/dev/herbertofury/creeperella/entity/CreeperellaEntity.java' | sha256sum -c -
          echo 'c53bcbeadb69474b5f14ff3416665b81e4fe0a2c9fb1d9ba2c0d8899f8f88618  src/main/java/dev/herbertofury/creeperella/registry/ModItems.java' | sha256sum -c -
          echo '45ca025deed19367a239d4e65ed739b23433e7fbf462d50bbabbce634d8d51a3  src/main/java/dev/herbertofury/creeperella/event/CommonEvents.java' | sha256sum -c -

          test -f build.gradle
          test -f src/main/java/dev/herbertofury/creeperella/entity/CreeperellaEntity.java
          test -f src/main/java/dev/herbertofury/creeperella/item/FuseWhistleItem.java
          grep -q '^minecraft_version=1.20.1$' gradle.properties
          grep -q '^forge_version=47.4.23$' gradle.properties
          grep -q '^mod_version=1.2.0$' gradle.properties
          grep -q 'ENABLE_COMPANIONS' src/main/java/dev/herbertofury/creeperella/config/CreeperellaConfig.java
          grep -q 'performCompanionExplosion' src/main/java/dev/herbertofury/creeperella/entity/CreeperellaEntity.java
          grep -q 'public void setSwellDir' src/main/java/dev/herbertofury/creeperella/entity/CreeperellaEntity.java
          grep -q 'public void ignite' src/main/java/dev/herbertofury/creeperella/entity/CreeperellaEntity.java
          grep -q 'net.minecraft.world.entity.TamableAnimal' src/main/java/dev/herbertofury/creeperella/entity/CreeperellaEntity.java
          grep -q 'FoodProperties' src/main/java/dev/herbertofury/creeperella/registry/ModItems.java
          grep -q 'onExplosionDetonate' src/main/java/dev/herbertofury/creeperella/event/CommonEvents.java
          grep -q 'getAffectedEntities().removeIf' src/main/java/dev/herbertofury/creeperella/event/CommonEvents.java
          grep -q 'FUSE_WHISTLE' src/main/java/dev/herbertofury/creeperella/registry/ModItems.java
          test "$(find src/main/java -name '*.java' | wc -l)" -ge 14
          grep -q "net.minecraftforge.renamer.*1.1.2" build.gradle
          grep -q 'renamer.mappings.from minecraft.dependency.toSrgFile' build.gradle

      - name: Compile, remap and build production JAR
        working-directory: /tmp/creeperella
        shell: bash
        run: |
          set -euo pipefail
          gradle build --no-daemon --stacktrace
          prod_jar="$(find build/libs -maxdepth 1 -type f -name '*-srg.jar' -print -quit)"
          test -n "$prod_jar"
          unzip -t "$prod_jar"
          echo "Production JAR: $prod_jar"
          sha256sum "$prod_jar" | tee build/libs/PRODUCTION-SHA256.txt

      - name: Real Forge dedicated-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/creeperella-server
          mkdir -p /tmp/creeperella-server/mods
          cd /tmp/creeperella-server
          curl -fL --retry 4 --retry-delay 2 \
            -o forge-installer.jar \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar'
          echo 'ed31ce02ac69176f34353235cb2508d5a0f1e088  forge-installer.jar' | sha1sum -c -
          java -jar forge-installer.jar --installServer
          prod_jar="$(find /tmp/creeperella/build/libs -maxdepth 1 -type f -name '*-srg.jar' -print -quit)"
          cp "$prod_jar" mods/creeperella-1.2.0.jar
          echo 'eula=true' > eula.txt
          : > server.log
          setsid ./run.sh nogui > server.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 150); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' server.log; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat server.log
          if [ "$ready" -ne 1 ]; then
            echo 'Production Forge server did not reach ready state.' >&2
            exit 1
          fi
          grep -Eiq 'creeperella|Bloom & Boom' server.log
          echo 'Production-remapped Creeperella 1.2.0 loaded and Forge server reached ready state.'
          kill -TERM -- "-$pid" 2>/dev/null || true
          sleep 2
          kill -KILL -- "-$pid" 2>/dev/null || true

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creeperella-1.2.0-production-ci
          if-no-files-found: warn
          path: |
            /tmp/creeperella/build/libs/*-srg.jar
            /tmp/creeperella/build/libs/PRODUCTION-SHA256.txt
            /tmp/creeperella-server/server.log
