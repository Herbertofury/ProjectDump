name: Creeperella 1.20.1 Verify

on:
  push:
    branches:
      - build/creeperella-1.20.1
      - build/creeperella-1.20.1-ci2
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/creeperella-1.20.1-build.yml'
      - 'projects/creeperella/ci/v1.1.0/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct and validate Creeperella source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/creeperella /tmp/creeperella.zip /tmp/creeperella.b64
          mkdir -p /tmp/creeperella
          head -c 15000 projects/creeperella/ci/v1.1.0/source.b64.part00 > /tmp/creeperella.b64
          head -c 15000 projects/creeperella/ci/v1.1.0/source.b64.part01 >> /tmp/creeperella.b64
          head -c 15000 projects/creeperella/ci/v1.1.0/source.b64.part02 >> /tmp/creeperella.b64
          cat projects/creeperella/ci/v1.1.0/source.b64.part03 >> /tmp/creeperella.b64
          tr -d '\r\n' < /tmp/creeperella.b64 | base64 -d > /tmp/creeperella.zip
          echo '519e8a082aa0c4f043636248cd5f609ca49b51a9142b0e704af46c4c91cbccb7  /tmp/creeperella.zip' | sha256sum -c -
          unzip -t /tmp/creeperella.zip
          unzip -q /tmp/creeperella.zip -d /tmp/creeperella
          test -f /tmp/creeperella/build.gradle
          test -f /tmp/creeperella/src/main/java/dev/herbertofury/creeperella/Creeperella.java
          test -f /tmp/creeperella/src/main/java/dev/herbertofury/creeperella/entity/CreeperellaEntity.java
          grep -q '^minecraft_version=1.20.1$' /tmp/creeperella/gradle.properties
          grep -q '^forge_version=47.4.23$' /tmp/creeperella/gradle.properties
          grep -q '^mod_version=1.1.0$' /tmp/creeperella/gradle.properties
          grep -q 'BLOSSOM' /tmp/creeperella/src/main/java/dev/herbertofury/creeperella/entity/CreeperellaKind.java
          test "$(find /tmp/creeperella/src/main/java -name '*.java' | wc -l)" -ge 10
          test "$(find /tmp/creeperella/src/main/resources -name '*.json' | wc -l)" -ge 20

      - name: Compile and build
        working-directory: /tmp/creeperella
        run: gradle build --no-daemon --stacktrace

      - name: Dedicated server smoke test
        working-directory: /tmp/creeperella
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          set +e
          timeout 120s gradle runServer --no-daemon --stacktrace > server.log 2>&1
          code=$?
          set -e
          cat server.log
          if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' server.log; then
            echo 'Dedicated server reached ready state.'
          else
            echo "Dedicated server did not reach ready state (exit ${code})." >&2
            exit 1
          fi

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creeperella-1.1.0-ci
          if-no-files-found: warn
          path: |
            /tmp/creeperella/build/libs/*.jar
            /tmp/creeperella/server.log
