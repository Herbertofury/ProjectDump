# Temporary public runner workflow for the Minecraft Mod Vault v0.9.0 offline deep seed.
# The resulting artifact is independently verified before use and this branch is never merged.
name: MMV v0.9.0 Mojang deep manifest seed

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-mmv-v090-mojang-deep-seed.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, hash-verify, and normalize every Mojang version manifest
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mmv-mojang-deep-seed"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cd "$ROOT"
          cat > build_seed.py <<'PY'
          import concurrent.futures
          import gzip
          import hashlib
          import json
          import os
          import time
          import urllib.request
          from collections import Counter

          MANIFEST_URL = "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"
          USER_AGENT = "MinecraftModVault/0.9.0 deep-seed-builder"

          def fetch(url, attempts=5):
              last = None
              for attempt in range(attempts):
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT, "Accept": "application/json"})
                      with urllib.request.urlopen(request, timeout=60) as response:
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}")
                          return response.read()
                  except Exception as exc:
                      last = exc
                      if attempt + 1 < attempts:
                          time.sleep(min(8, 2 ** attempt))
              raise RuntimeError(f"fetch {url}: {last}")

          manifest_raw = fetch(MANIFEST_URL)
          manifest = json.loads(manifest_raw)
          versions = manifest["versions"]
          if len(versions) < 900:
              raise RuntimeError(f"Mojang manifest unexpectedly contains only {len(versions)} versions")

          def fetch_version(item):
              raw = fetch(item["url"])
              source_sha1 = hashlib.sha1(raw).hexdigest()
              if source_sha1.lower() != item["sha1"].lower():
                  raise RuntimeError(f"SHA1 mismatch for {item['id']}: expected {item['sha1']} got {source_sha1}")
              payload = json.loads(raw)
              if payload.get("id") != item["id"]:
                  raise RuntimeError(f"identity mismatch for {item['id']}: got {payload.get('id')}")
              return {
                  "id": item["id"],
                  "sourceUrl": item["url"],
                  "sourceSHA1": source_sha1,
                  "sourceSHA256": hashlib.sha256(raw).hexdigest(),
                  "manifest": payload,
              }

          records = [None] * len(versions)
          failures = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              futures = {pool.submit(fetch_version, item): index for index, item in enumerate(versions)}
              for future in concurrent.futures.as_completed(futures):
                  index = futures[future]
                  try:
                      records[index] = future.result()
                  except Exception as exc:
                      failures.append({"version": versions[index]["id"], "error": str(exc)})
          if failures:
              raise RuntimeError(json.dumps({"failures": failures}, indent=2))
          if any(record is None for record in records):
              raise RuntimeError("deep seed contains missing records")

          out_path = "mojang-version-details-v2.jsonl.gz"
          uncompressed_bytes = 0
          with open(out_path, "wb") as output:
              with gzip.GzipFile(filename="", mode="wb", fileobj=output, compresslevel=9, mtime=0) as compressed:
                  for record in records:
                      line = json.dumps(record, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8") + b"\n"
                      compressed.write(line)
                      uncompressed_bytes += len(line)

          type_counts = Counter(item["manifest"].get("type", "unknown") for item in records)
          libraries = [library.get("name", "") for item in records for library in item["manifest"].get("libraries", [])]
          downloads = [item["manifest"].get("downloads", {}) for item in records]
          summary = {
              "schemaVersion": 1,
              "generatedAt": "2026-08-20T00:00:00Z",
              "source": MANIFEST_URL,
              "sourceManifestSHA256": hashlib.sha256(manifest_raw).hexdigest(),
              "count": len(records),
              "latestRelease": manifest.get("latest", {}).get("release", ""),
              "latestSnapshot": manifest.get("latest", {}).get("snapshot", ""),
              "newest": records[0]["id"],
              "oldest": records[-1]["id"],
              "types": dict(type_counts),
              "versionsWithJavaRuntime": sum(bool(item["manifest"].get("javaVersion")) for item in records),
              "versionsWithAssetIndex": sum(bool(item["manifest"].get("assetIndex")) for item in records),
              "versionsWithClient": sum("client" in value for value in downloads),
              "versionsWithServer": sum("server" in value for value in downloads),
              "versionsWithClientMappings": sum("client_mappings" in value for value in downloads),
              "versionsWithServerMappings": sum("server_mappings" in value for value in downloads),
              "versionsWithLogging": sum(bool(item["manifest"].get("logging")) for item in records),
              "runtimeLibraryRows": len(libraries),
              "uniqueRuntimeLibraries": len(set(filter(None, libraries))),
              "uncompressedBytes": uncompressed_bytes,
              "gzipBytes": os.path.getsize(out_path),
              "gzipSHA256": hashlib.sha256(open(out_path, "rb").read()).hexdigest(),
          }
          with open("Mojang-deep-seed-summary.json", "w", encoding="utf-8", newline="\n") as output:
              json.dump(summary, output, indent=2, sort_keys=True)
              output.write("\n")

          with gzip.open(out_path, "rt", encoding="utf-8") as source:
              verified = 0
              for line in source:
                  payload = json.loads(line)
                  if not payload.get("id") or not payload.get("sourceSHA1") or not payload.get("manifest"):
                      raise RuntimeError("invalid normalized deep-seed record")
                  verified += 1
          if verified != len(records):
              raise RuntimeError(f"round-trip count mismatch: {verified} != {len(records)}")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          python3 build_seed.py | tee MCMETA-BUILD-LOG.txt
          sha256sum mojang-version-details-v2.jsonl.gz Mojang-deep-seed-summary.json MCMETA-BUILD-LOG.txt > SHA256SUMS.txt

      - name: Upload verified Mojang deep seed
        uses: actions/upload-artifact@v4
        with:
          name: mmv-v090-mojang-deep-seed
          path: |
            ${{ runner.temp }}/mmv-mojang-deep-seed/mojang-version-details-v2.jsonl.gz
            ${{ runner.temp }}/mmv-mojang-deep-seed/Mojang-deep-seed-summary.json
            ${{ runner.temp }}/mmv-mojang-deep-seed/MCMETA-BUILD-LOG.txt
            ${{ runner.temp }}/mmv-mojang-deep-seed/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
