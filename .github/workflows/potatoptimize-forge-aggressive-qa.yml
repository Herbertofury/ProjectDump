name: Potatoptimize Forge 1.20.1 Aggressive Profile QA

on:
  push:
    paths:
      - 'minecraft/potatoptimize-forge-1.20.1/**'
      - '.github/workflows/potatoptimize-forge-aggressive-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: potatoptimize-aggressive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggressive-production-linkage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout tested tree
        uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build remapped production JAR once
        working-directory: minecraft/potatoptimize-forge-1.20.1
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          chmod +x gradlew
          ./gradlew --no-daemon clean build
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)
          test -n "$JAR"
          echo "MOD_JAR=$PWD/$JAR" >> "$GITHUB_ENV"
          sha256sum "$JAR" | tee build/AGGRESSIVE-SHA256SUMS.txt

      - name: Install clean Forge 47.4.23 server once
        run: |
          set -euxo pipefail
          mkdir -p /tmp/potatoptimize-aggressive-server /tmp/potatoptimize-aggressive-evidence
          cd /tmp/potatoptimize-aggressive-server
          curl --fail --location --retry 3 --output forge-installer.jar \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar
          java -jar forge-installer.jar --installServer
          test -f run.sh
          chmod +x run.sh
          printf 'eula=true\n' > eula.txt
          mkdir -p mods config
          cp "$MOD_JAR" mods/

      - name: Sweep optimization families, isolate failures, then challenge all-on
        shell: bash
        run: |
          set -uox pipefail
          SERVER=/tmp/potatoptimize-aggressive-server
          EVIDENCE=/tmp/potatoptimize-aggressive-evidence
          SRC="$GITHUB_WORKSPACE/minecraft/potatoptimize-forge-1.20.1/src/main/resources/assets/potatoptimize/potatoptimize-mixin-config-default.properties"
          test -f "$SRC" || exit 1
          : > "$EVIDENCE/family-failures.txt"
          : > "$EVIDENCE/rule-failures.txt"
          : > "$EVIDENCE/combination-failures.txt"
          profile_index=0

          make_family_config() {
            local family="$1" out="$2"
            awk -v family="$family" '
              /^mixin\./ {
                key=$1
                sub(/ = (true|false)$/, " = false")
                if (key ~ ("^mixin\\." family "\\.")) sub(/ = false$/, " = true")
              }
              { print }
            ' "$SRC" > "$out"
          }

          make_rule_config() {
            local rule="$1" out="$2"
            awk -v rule="$rule" '
              /^mixin\./ {
                key=$1
                sub(/ = (true|false)$/, " = false")
                if (key == rule) sub(/ = false$/, " = true")
              }
              { print }
            ' "$SRC" > "$out"
          }

          make_all_config() {
            local out="$1"
            sed -E 's/^(mixin\.[^=]+ = )(true|false)$/\1true/' "$SRC" > "$out"
          }

          stop_profile_group() {
            local pid="$1"
            if kill -0 "$pid" 2>/dev/null; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              for _ in $(seq 1 10); do
                if ! kill -0 "$pid" 2>/dev/null; then return 0; fi
                sleep 1
              done
              kill -KILL -- "-$pid" 2>/dev/null || true
            fi
          }

          run_profile() {
            local label="$1" config_file="$2"
            local fifo="$SERVER/server-input-$label"
            local console="$EVIDENCE/$label-console.log"
            local latest="$EVIDENCE/$label-latest.log"
            local pid ready=0 clean=1 exit_code=0 port

            profile_index=$((profile_index + 1))
            port=$((25564 + profile_index))

            rm -rf "$SERVER/world" "$SERVER/logs" "$SERVER/crash-reports"
            rm -f "$fifo"
            mkdir -p "$SERVER/config"
            cp "$config_file" "$SERVER/config/potatoptimize.properties"
            cp "$config_file" "$EVIDENCE/$label.properties"
            cat > "$SERVER/server.properties" <<EOF
          server-port=$port
          online-mode=false
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          EOF
            mkfifo "$fifo"

            cd "$SERVER" || return 1
            exec 3<>"$fifo"
            setsid ./run.sh nogui <"$fifo" >"$console" 2>&1 &
            pid=$!
            echo "$pid $port" > "$EVIDENCE/$label.process"

            for _ in $(seq 1 100); do
              if test -f logs/latest.log && grep -q 'Done (' logs/latest.log; then
                ready=1
                break
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if test "$ready" -eq 1; then
              printf 'gamerule doMobSpawning false\n' >&3
              printf 'setblock 0 100 0 minecraft:oak_sign[rotation=0]\n' >&3
              printf 'setblock 1 100 0 minecraft:chest\n' >&3
              printf 'summon minecraft:zombie 2 100 2\n' >&3
              printf 'summon minecraft:villager 4 100 4\n' >&3
              printf 'summon minecraft:item 3 100 2 {Item:{id:"minecraft:rotten_flesh",Count:1b}}\n' >&3
              printf 'forceload add -1 -1 1 1\n' >&3
              printf 'time set midnight\n' >&3
              printf 'weather rain\n' >&3
              printf 'save-all flush\n' >&3
              printf 'list\n' >&3
              sleep 5
              printf 'stop\n' >&3
            else
              clean=0
            fi

            exec 3>&-
            for _ in $(seq 1 35); do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$pid" 2>/dev/null; then
              clean=0
              stop_profile_group "$pid"
            fi
            wait "$pid" || exit_code=$?
            test -f "$SERVER/logs/latest.log" && cp "$SERVER/logs/latest.log" "$latest"
            rm -f "$fifo"

            if test -f "$latest" && grep -Eiq 'MixinApplyError|MixinTransformerError|InjectionError|Critical injection failure|InvalidMixinException|InvalidInjectionException|NoClassDefFoundError.*potatoptimize|ClassNotFoundException.*potatoptimize' "$latest"; then
              clean=0
            fi
            if grep -Eiq 'MixinApplyError|MixinTransformerError|InjectionError|Critical injection failure|InvalidMixinException|InvalidInjectionException|NoClassDefFoundError.*potatoptimize|ClassNotFoundException.*potatoptimize' "$console"; then
              clean=0
            fi
            if test "$ready" -ne 1 || test "$clean" -ne 1 || test "$exit_code" -ne 0; then
              echo "PROFILE FAILED: $label (ready=$ready clean=$clean exit=$exit_code port=$port)"
              tail -n 160 "$console" || true
              test -f "$latest" && tail -n 160 "$latest" || true
              return 1
            fi
            echo "PROFILE PASSED: $label (port=$port)"
            return 0
          }

          families=(block_entity entity fastmath item logic memory networking random remove startup threading unstream world)
          for family in "${families[@]}"; do
            cfg="$EVIDENCE/family-$family.requested.properties"
            make_family_config "$family" "$cfg"
            if ! run_profile "family-$family" "$cfg"; then
              echo "$family" >> "$EVIDENCE/family-failures.txt"
              while IFS= read -r rule; do
                test -n "$rule" || continue
                rule_label=$(printf '%s' "$rule" | tr '.' '_')
                rule_cfg="$EVIDENCE/rule-$rule_label.requested.properties"
                make_rule_config "$rule" "$rule_cfg"
                if ! run_profile "rule-$rule_label" "$rule_cfg"; then
                  echo "$rule" >> "$EVIDENCE/rule-failures.txt"
                fi
              done < <(awk -v family="$family" '$1 ~ ("^mixin\\." family "\\.") { print $1 }' "$SRC")
            fi
          done

          all_cfg="$EVIDENCE/all-on.requested.properties"
          make_all_config "$all_cfg"
          if ! run_profile all-on "$all_cfg"; then
            echo all-on >> "$EVIDENCE/combination-failures.txt"
          fi

          {
            echo '=== FAMILY FAILURES ==='
            cat "$EVIDENCE/family-failures.txt"
            echo '=== INDIVIDUAL RULE FAILURES ==='
            cat "$EVIDENCE/rule-failures.txt"
            echo '=== COMBINATION FAILURES ==='
            cat "$EVIDENCE/combination-failures.txt"
          } | tee "$EVIDENCE/SWEEP-SUMMARY.txt"

          if test -s "$EVIDENCE/family-failures.txt" || test -s "$EVIDENCE/rule-failures.txt" || test -s "$EVIDENCE/combination-failures.txt"; then
            exit 1
          fi

      - name: Upload aggressive-profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potatoptimize-forge-1.20.1-aggressive-profile-evidence
          path: |
            minecraft/potatoptimize-forge-1.20.1/build/libs/*.jar
            minecraft/potatoptimize-forge-1.20.1/build/AGGRESSIVE-SHA256SUMS.txt
            /tmp/potatoptimize-aggressive-evidence/**
          if-no-files-found: warn
