name: Async 1.20.1 Ultimate Source-Pairs Static Proof

on:
  push:
    branches: [async-1.20.1-ultimate-perf-lab-20260913-source-pairs]

permissions:
  contents: read

jobs:
  prove-source-pairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JustHari01/HariMultiThread
          ref: f381611c2d71a85192e2028f9e30c03823a6482b
          path: upstream
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install shader validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools
      - name: Reconstruct exact released 2.1.1 source
        shell: bash
        run: |
          set -euo pipefail
          python3 minecraft/async-1.20.1-ultimate/apply_overlay.py upstream minecraft/async-1.20.1-ultimate/overlay
          python3 minecraft/async-1.20.1-ultimate/apply_hardening.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_lifecycle.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_platform.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_interop.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_lwjgl_runtime.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_backend_architecture.py upstream minecraft/async-1.20.1-ultimate/backend-overlay
          python3 minecraft/async-1.20.1-ultimate/apply_spawn_interop.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_world_batch.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_spatial_gpu.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_mixin_packaging.py upstream
          cp -a upstream before-source-pairs
      - name: Apply and prove source-pairs-only transform
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile minecraft/async-1.20.1-ultimate/apply_perf_source_pairs_only.py
          python3 minecraft/async-1.20.1-ultimate/apply_perf_source_pairs_only.py upstream
          git -C upstream diff --check
          python3 - <<'PY'
          from pathlib import Path
          import filecmp, os
          a=Path('before-source-pairs'); b=Path('upstream')
          changed=[]
          for p in a.rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              rel=p.relative_to(a); q=b/rel
              if not q.is_file() or p.read_bytes()!=q.read_bytes(): changed.append(str(rel))
          expected={
            'common/src/main/java/com/axalotl/async/common/gpu/GpuCollisionDispatcher.java',
            'common/src/main/java/com/axalotl/async/common/gpu/GpuPushBatch.java',
            'common/src/main/java/com/axalotl/async/common/gpu/vulkan/VulkanCollisionBackend.java',
            'common/src/main/resources/assets/async/shaders/collision_broadphase.comp',
            'vulkan-backend/src/main/java/com/axalotl/async/vulkanruntime/LwjglVulkanBackend.java',
          }
          assert set(changed)==expected, changed
          print('exact five-file production delta PASS')
          PY
          grep -F 'sourceCount > 0 && sourceCount < count' upstream/common/src/main/java/com/axalotl/async/common/gpu/GpuCollisionDispatcher.java
          grep -F 'CollisionPair pair : pairs' upstream/common/src/main/java/com/axalotl/async/common/gpu/GpuPushBatch.java
          ! grep -R -E 'CandidateBatch|computeGpuCandidates\(|ensureHostPairCapacity\(|AtomicIntegerArray nextIndex|class BatchState' upstream/common/src/main/java upstream/vulkan-backend/src/main/java
      - name: Prove source-pair coverage math
        shell: bash
        run: |
          python3 - <<'PY'
          from itertools import combinations
          for n,s in ((16,1),(16,16),(64,7),(257,256),(768,256),(1024,17)):
              got={(i,j) for i in range(s) for j in range(i+1,n)}
              want={(i,j) for i,j in combinations(range(n),2) if i<s or j<s}
              assert got==want
              print('PASS',n,s,len(got))
          PY
      - name: Compile and validate Vulkan shader
        shell: bash
        run: |
          set -euo pipefail
          shader=upstream/common/src/main/resources/assets/async/shaders/collision_broadphase.comp
          glslangValidator -V "$shader" -o /tmp/source-pairs.spv
          test -s /tmp/source-pairs.spv
          test "$(xxd -p -l 4 /tmp/source-pairs.spv)" = '03022307'
      - name: Prove transform fails closed on reapplication
        shell: bash
        run: |
          set +e
          python3 minecraft/async-1.20.1-ultimate/apply_perf_source_pairs_only.py upstream > /tmp/reapply.log 2>&1
          rc=$?
          set -e
          cat /tmp/reapply.log
          test "$rc" -ne 0
