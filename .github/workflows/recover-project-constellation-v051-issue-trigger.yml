name: Issue-triggered Project Constellation v0.5.1 recovery

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[recovery] publish Project Constellation v0.5.1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dispatch deterministic publisher and wait
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow='recover-project-constellation-v051-deterministic.yml'
          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
          run_id=''
          for _ in $(seq 1 60); do
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$candidate" != '0' && "$candidate" != "$before" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify canonical publication marker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gate="$(gh api "repos/${GITHUB_REPOSITORY}/contents/project-constellation/publication-gate/v0.5.1.json?ref=main" --jq '.content' | tr -d '\n' | base64 --decode)"
          jq -e '.status == "VERIFIED_PUBLISHED"' <<<"$gate" >/dev/null

      - name: Record issue recovery success
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --comment 'Deterministic v0.5.1 publication recovery completed and the canonical publication marker verified.'
