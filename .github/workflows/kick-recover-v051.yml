name: Kick Project Constellation v0.5.1 recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-recover-v051.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deterministic recovery workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run recover-project-constellation-v051-deterministic.yml --repo "${{ github.repository }}" --ref main

