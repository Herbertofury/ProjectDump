name: One-shot PCX-061 wiki refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wiki-maintainer-pcx061.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: one-shot-pcx061-wiki-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Refresh exact Petz persistence evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wikis/PCX-061-petz-shared-core.md')
          s = p.read_text(encoding='utf-8')
          old = '72669096280904eb0f210d49d3a3e3163f42b106'
          new = '2612396804b44399b7b23b4f32f21217325da79c'
          if s.count(old) != 2:
              raise SystemExit(f'expected exactly 2 stale PR-head occurrences, found {s.count(old)}')
          s = s.replace(old, new)

          old_boundary = '''**Current implementation boundary:** current `main` still has the source-proven persistence defect tracked by [issue #9](https://github.com/Herbertofury/GameSync-Next/issues/9). PR #10 implements a preservation-first repair in source, but exact-head package/regression/Extension V2/parity/Ferrum/security execution is still blocked before workflow steps by the private hosted-runner allocation condition. Complete original PF Magic behavioral parity, merged and runtime-proven cross-restart persistence, complete use of every inventoried Petz resource, and end-to-end parity across shipping GameSync, Extension V2, and desktop are not yet proven.'''
          new_boundary = '''**Current implementation boundary:** current `main` still has the source-proven persistence defect tracked by [issue #9](https://github.com/Herbertofury/GameSync-Next/issues/9). PR #10 implements a preservation-first repair in source at exact head `2612396804b44399b7b23b4f32f21217325da79c`, but its fresh Petz verify run `32459020450` and Secret Scan run `32459020441` both failed before GitHub exposed executable job steps. Public Ferrum recovery infrastructure is healthy but currently stops at the explicit private GameSync read-token preflight, so the proposal remains unmerged and staging-only. Complete original PF Magic behavioral parity, merged and runtime-proven cross-restart persistence, complete use of every inventoried Petz resource, and end-to-end parity across shipping GameSync, Extension V2, and desktop are not yet proven.'''
          if old_boundary not in s:
              raise SystemExit('current implementation boundary did not match expected source')
          s = s.replace(old_boundary, new_boundary)

          old_execution = '''The latest issue/PR evidence records that exact-head workflow attempts still fail before GitHub supplies executable steps under the known private hosted-runner allocation/payment-spending-limit blocker. This is an **execution blocker**, not evidence that the Petz repair failed or passed. Keep the repair staging-only until the exact current head actually executes and satisfies every gate.'''
          new_execution = '''The exact current PR head is `2612396804b44399b7b23b4f32f21217325da79c`. Fresh private-repository checks on that head are **not product test results**: Petz persistence verify run `32459020450` / job `96701992871` and Secret Scan run `32459020441` / job `96701992684` both completed `failure` with `steps: null`, before any executable product-verification step ran.\n\nA public recovery lane exists in Ferrum PR #62 at head `3e9e5371c03f4aac5be27c5e128a0cd60e1fa037`. Its runner-pool probe `32460964252`, registry freshness `32460964357`, Stack Playwright lock integrity `32460964247`, and Ferrum CI `32460964290` succeeded, proving the public runner path is healthy. The cross-repository Petz recovery matrix still stops at the explicit private GameSync read-token preflight before checkout, Node setup, lock regeneration, or candidate tests. This narrows the remaining acceptance blocker to private GameSync execution/read authorization; it does **not** convert source review or public infrastructure health into Petz acceptance. Keep PR #10 draft and unmerged until the exact current head actually executes and satisfies every gate.'''
          if old_execution not in s:
              raise SystemExit('execution-boundary paragraph did not match expected source')
          s = s.replace(old_execution, new_execution)

          old_trouble = '''Inspect workflow job steps before inferring a product failure. The latest Petz verification and Secret Scan attempts are documented as failing before executable steps were allocated under the known private hosted-runner account blocker. A zero-step runner failure proves neither pass nor fail for the Petz implementation.'''
          new_trouble = '''Inspect workflow job steps before inferring a product failure. On exact head `2612396804b44399b7b23b4f32f21217325da79c`, Petz verify run `32459020450` / job `96701992871` and Secret Scan run `32459020441` / job `96701992684` failed with `steps: null`, so no Petz build, regression, browser, restart, integrity, or security command actually executed. Public Ferrum recovery jobs are healthy, but the cross-repository lane currently stops at the private GameSync read-token preflight. Treat both conditions as infrastructure/authorization evidence, not product pass/fail evidence.'''
          if old_trouble not in s:
              raise SystemExit('troubleshooting paragraph did not match expected source')
          s = s.replace(old_trouble, new_trouble)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check -- wikis/PCX-061-petz-shared-core.md
          git diff --exit-code -- . ':!wikis/PCX-061-petz-shared-core.md'
          grep -q '2612396804b44399b7b23b4f32f21217325da79c' wikis/PCX-061-petz-shared-core.md
          grep -q '32459020450' wikis/PCX-061-petz-shared-core.md
          grep -q '32460964252' wikis/PCX-061-petz-shared-core.md

      - name: Commit refreshed source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wikis/PCX-061-petz-shared-core.md
          git commit -m 'docs: refresh Petz Shared Core exact persistence evidence'
          git push origin HEAD:main
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish and verify complete Wiki
        id: wiki
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          bash tools/github-wiki/wiki-sync.sh "${{ github.repository }}" wikis "${{ github.server_url }}" | tee "$log_file"
          wiki_commit="$(awk '/^Wiki master commit: / {print $4}' "$log_file" | tail -n 1)"
          [[ "$wiki_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "wiki_commit=$wiki_commit" >> "$GITHUB_OUTPUT"

      - name: Record exact-source publication status
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.commit.outputs.source_sha }}
          WIKI_COMMIT: ${{ steps.wiki.outputs.wiki_commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_SHA}" \
            -f state=success \
            -f context=wiki-publication \
            -f description="fresh-clone byte-verified wiki ${WIKI_COMMIT}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
