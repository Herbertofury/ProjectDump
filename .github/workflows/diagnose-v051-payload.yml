name: Diagnose v0.5.1 payload

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-v051-payload.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Inspect main and sourcebundle payloads
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main automation/pc-v051-sourcebundle
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re, subprocess

          expected = {
            'qv': (128283, '8234e889c6b8cae67158c3cec525e3607bb8403173cf095e80c1b7ffd597ffe1'),
            'master': (143064, 'dd1f852bf4f7d677d3a499a7238359dff55aa6a3bc3f338c534dca2c89faa1a8'),
          }
          allowed = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')

          def inspect(label, stem, chunks):
              text=''.join(chunks)
              compact=re.sub(r'\s+','',text)
              invalid=[(i,ch,ord(ch)) for i,ch in enumerate(compact) if ch not in allowed]
              padding=[i for i,ch in enumerate(compact) if ch=='=']
              print({'label':label,'stem':stem,'chunkLengths':[len(c) for c in chunks],'total':len(text),'compact':len(compact),'mod4':len(compact)%4,'invalidCount':len(invalid),'invalidFirst':invalid[:30],'padding':padding[:20]})
              for i, ch, _ in invalid[:20]:
                  print({'label':label,'stem':stem,'invalidContext':compact[max(0,i-32):i+33]})
              offsets=[]; n=0
              for c in chunks:
                  n += len(re.sub(r'\s+','',c)); offsets.append(n)
              print({'label':label,'stem':stem,'compactChunkEnds':offsets})
              for off in offsets[:-1]:
                  print({'label':label,'stem':stem,'boundary':off,'context':compact[max(0,off-40):off+40]})
              filtered=''.join(ch for ch in compact if ch in allowed)
              try:
                  raw=base64.b64decode(filtered,validate=True)
                  data=gzip.decompress(raw)
                  print({'label':label,'stem':stem,'decode':'success','rawBytes':len(raw),'decodedBytes':len(data),'decodedSha256':hashlib.sha256(data).hexdigest(),'match':len(data)==expected[stem][0] and hashlib.sha256(data).hexdigest()==expected[stem][1]})
              except Exception as e:
                  print({'label':label,'stem':stem,'decode':'failure','error':repr(e),'filteredLength':len(filtered),'filteredMod4':len(filtered)%4})

          main_ref='origin/main'
          source_ref='origin/automation/pc-v051-sourcebundle'
          for stem in ('qv','master'):
              main_names=subprocess.check_output(['git','ls-tree','-r','--name-only',main_ref,'project-constellation/browser-gate'],text=True).splitlines()
              main_names=sorted(n for n in main_names if Path(n).name.startswith(f'{stem}.b64.part'))
              main_chunks=[subprocess.check_output(['git','show',f'{main_ref}:{n}'],text=True) for n in main_names]
              inspect('main',stem,main_chunks)
              source_names=subprocess.check_output(['git','ls-tree','-r','--name-only',source_ref,'project-constellation/browser-gate'],text=True).splitlines()
              source_names=sorted(n for n in source_names if Path(n).name.startswith(f'{stem}.b64.part'))
              source_chunks=[subprocess.check_output(['git','show',f'{source_ref}:{n}'],text=True) for n in source_names]
              inspect('sourcebundle',stem,source_chunks)
          PY
