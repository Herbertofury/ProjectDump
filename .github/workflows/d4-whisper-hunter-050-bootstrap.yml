name: D4 Whisper Hunter 0.5.0 Executioner Guard

on:
  push:
    branches:
      - build/d4-whisper-hunter-0.5.0-executioner-guard
    paths:
      - '.github/workflows/d4-whisper-hunter-050-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-build-publish:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch exact verified 0.5.0 source checkpoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceUrl = 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-9e84-81fd-ab24-ef3c79584504/raw?se=2026-09-27T03%3A24%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=9a4e6560-4079-59ce-9ad0-2d1c5600afe0&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T14%3A29%3A31Z&ske=2026-09-27T14%3A29%3A31Z&sks=b&skv=2026-02-06&sig=SkgF6FJ0XaTnw5y3N5GLnjy0O2qfJ43DiKJdwzxpGnc%3D'
          Invoke-WebRequest -Uri $sourceUrl -OutFile 'D4WhisperHunter-0.5.0-source.zip'
          $sha = (Get-FileHash 'D4WhisperHunter-0.5.0-source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '1bd3403b77b2c5f437514c28da1620cc84e534afab7af02065ab77faf7fb0655') {
            throw "0.5.0 source SHA mismatch: $sha"
          }
          Expand-Archive -Path 'D4WhisperHunter-0.5.0-source.zip' -DestinationPath '_source' -Force
          $src = Resolve-Path '_source/D4WhisperHunter-0.5.0-source'
          Copy-Item $src 'buildsrc' -Recurse
          if (!(Test-Path 'buildsrc/whisper_hunter/evade.py')) { throw 'Smart Evade source missing' }
          if (!(Test-Path 'buildsrc/THIRD_PARTY_LICENSES/griffeth-barker-diablo-iv-evade-macro-MIT.txt')) { throw 'Evade Macro MIT license missing' }

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install build dependencies
        working-directory: buildsrc
        run: python -m pip install -r requirements-build.txt

      - name: Compile and run complete 0.5.0 regressions
        working-directory: buildsrc
        run: |
          python -m compileall -q whisper_hunter d4_whisper_hunter.py tests
          python -m pytest -q

      - name: Verify Smart Evade decision and one-shot dispatch on Windows
        working-directory: buildsrc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from whisper_hunter.config import Config
          from whisper_hunter.danger import DANGER_HIGH, DangerEvent
          from whisper_hunter.evade import EvadeController

          sent = []
          cfg = Config(
              auto_evade_enabled=True,
              auto_evade_foreground_only=True,
              auto_evade_executioner=True,
              auto_evade_cooldown_s=0.72,
          )
          sword = DangerEvent(
              9001, "executioner", DANGER_HIGH, .99, (960.,430.),
              (940,300,40,230),
              ((940.,300.),(980.,300.),(980.,530.),(940.,530.)),
              0., eta_seconds=.35, locked=True
          )
          evade = EvadeController(
              cfg,
              sender=lambda vk: sent.append(vk) or True,
              foreground_check=lambda: True,
              input_guard=lambda: True,
          )
          assert evade.maybe_evade([sword], 1000.0) is sword
          assert sent == [0x20], sent
          assert evade.maybe_evade([sword], 1001.0) is None
          assert sent == [0x20], sent

          inactive_sent = []
          inactive = EvadeController(
              cfg,
              sender=lambda vk: inactive_sent.append(vk) or True,
              foreground_check=lambda: False,
              input_guard=lambda: True,
          )
          assert inactive.maybe_evade([sword], 2000.0) is None
          assert inactive_sent == []
          print("Smart Evade event-driven foreground gate PASS", sent)
          '@ | python -

      - name: Fetch and verify permitted upstream Sanctuary anchor
        working-directory: buildsrc
        run: python scripts/fetch_upstream_map.py

      - name: Verify donor map integrity
        working-directory: buildsrc
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from whisper_hunter.assets import verify_map; p=Path('assets/map_5_small.jpg'); assert verify_map(p); print('donor map integrity PASS')"

      - name: Verify dedicated Executioner warning sound dispatch
        working-directory: buildsrc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import winsound
          from whisper_hunter.audio import DangerSoundEngine
          from whisper_hunter.config import Config
          from whisper_hunter.danger import DANGER_HIGH, DangerEvent

          cfg = Config(danger_sound_enabled=True)
          engine = DangerSoundEngine(cfg)
          calls = []
          original = winsound.PlaySound
          winsound.PlaySound = lambda path, flags: calls.append(Path(path).name)
          try:
              sword = DangerEvent(
                  77, "executioner", DANGER_HIGH, .99, (960.,430.),
                  (940,300,40,230),
                  ((940.,300.),(980.,300.),(980.,530.),(940.,530.)),
                  4., eta_seconds=.35, locked=True
              )
              assert engine.alert(sword, 1000.0)
          finally:
              winsound.PlaySound = original
          assert calls == ["executioner.wav"], calls
          print("Executioner warning sound dispatch PASS", calls)
          '@ | python -

      - name: Build one-file Windows executable
        working-directory: buildsrc
        run: pyinstaller --noconfirm --clean --onefile --windowed --name D4WhisperHunter --collect-all cv2 --add-data "assets/map_5_small.jpg;assets" d4_whisper_hunter.py

      - name: Prove packaged EXE still resolves bundled map with empty cache
        working-directory: buildsrc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:D4WH_MAP_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:D4WH_BUNDLE_ROOT -ErrorAction SilentlyContinue
          $env:APPDATA = (Join-Path (Resolve-Path '.').Path '_isolated-appdata')
          Remove-Item $env:APPDATA -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          & '.\dist\D4WhisperHunter.exe' --asset-check | Tee-Object -FilePath '_asset-check.json'
          if ($LASTEXITCODE -ne 0) { throw "Asset check returned $LASTEXITCODE" }
          $result = Get-Content '_asset-check.json' -Raw | ConvertFrom-Json
          if (-not [bool]$result.verified -or $result.source -ne 'bundled') {
            throw "Bundled-map regression: $($result | ConvertTo-Json -Compress)"
          }

      - name: Create deterministic Whisper, DangerSense and Executioner fixtures
        working-directory: buildsrc
        run: python tests/make_ci_fixture.py --out _ci

      - name: Smoke-test packaged Whisper path
        working-directory: buildsrc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:D4WH_MAP_PATH = (Resolve-Path '_ci/fixture-map.png').Path
          & '.\dist\D4WhisperHunter.exe' --input '_ci/fixture-query.png' --output '_ci/whisper-annotated.png' | Tee-Object -FilePath '_ci/whisper.json'
          if ($LASTEXITCODE -ne 0) { throw "Whisper smoke returned $LASTEXITCODE" }
          $r = Get-Content '_ci/whisper.json' -Raw | ConvertFrom-Json
          if (-not [bool]$r.registered) { throw 'Packaged EXE failed map registration' }
          $favors = @($r.candidates | ForEach-Object { [int]$_.favor } | Sort-Object)
          if (($favors -join ',') -ne '1,3,5') { throw "Expected 1,3,5 Favor; got $($favors -join ',')" }
          if (@($r.tracked).Count -ne 3) { throw "Expected 3 tracked Whispers" }

      - name: Smoke-test packaged generic DangerSense path
        working-directory: buildsrc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:D4WH_MAP_PATH -ErrorAction SilentlyContinue
          & '.\dist\D4WhisperHunter.exe' --danger-input '_ci/fixture-danger.png' --danger-output '_ci/danger-annotated.png' | Tee-Object -FilePath '_ci/danger.json'
          if ($LASTEXITCODE -ne 0) { throw "DangerSense smoke returned $LASTEXITCODE" }
          $r = Get-Content '_ci/danger.json' -Raw | ConvertFrom-Json
          $top = @($r.danger_events)[0]
          if ($top.kind -ne 'explosion' -or [int]$top.level -ne 3 -or -not [bool]$top.urgent) {
            throw "Generic DangerSense regression: $($top | ConvertTo-Json -Compress)"
          }

      - name: Smoke-test packaged Executioner Guard path
        working-directory: buildsrc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\dist\D4WhisperHunter.exe' --danger-input '_ci/fixture-executioner.png' --danger-output '_ci/executioner-annotated.png' | Tee-Object -FilePath '_ci/executioner.json'
          if ($LASTEXITCODE -ne 0) { throw "Executioner smoke returned $LASTEXITCODE" }
          $r = Get-Content '_ci/executioner.json' -Raw | ConvertFrom-Json
          if (@($r.danger_events).Count -lt 1) { throw 'Executioner Guard produced no threat' }
          $top = @($r.danger_events)[0]
          if ($top.kind -ne 'executioner') { throw "Expected executioner, got $($top.kind)" }
          if ([int]$top.level -ne 3 -or -not [bool]$top.urgent -or -not [bool]$top.locked) {
            throw "Executioner threat not locked/high/urgent: $($top | ConvertTo-Json -Compress)"
          }
          if ($top.label -ne 'EXECUTIONER SWORD — EVADE') { throw "Unexpected label: $($top.label)" }

      - name: Publish verified source snapshot into repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'projects/d4-whisper-hunter/0.5.0/source'
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item '_source/D4WhisperHunter-0.5.0-source/*' $dest -Recurse
          Get-ChildItem $dest -Recurse -Directory | Where-Object { $_.Name -in @('__pycache__','.pytest_cache') } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          '1bd3403b77b2c5f437514c28da1620cc84e534afab7af02065ab77faf7fb0655  D4WhisperHunter-0.5.0-source.zip' | Set-Content -NoNewline 'projects/d4-whisper-hunter/0.5.0/SOURCE-SHA256.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'projects/d4-whisper-hunter/0.5.0'
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'd4-whisper-hunter: publish verified 0.5.0 source [skip ci]'
            git push origin HEAD:build/d4-whisper-hunter-0.5.0-executioner-guard
          }

      - name: Assemble verified 0.5.0 Windows bundle
        working-directory: buildsrc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/D4WhisperHunter.exe release/
          Copy-Item README.md,NOTICE.md,LICENSE release/
          New-Item -ItemType Directory -Force -Path release/THIRD_PARTY_LICENSES | Out-Null
          Copy-Item THIRD_PARTY_LICENSES/* release/THIRD_PARTY_LICENSES/
          Copy-Item _asset-check.json release/PACKAGED-BUNDLED-MAP-CHECK.json
          Copy-Item _ci/whisper.json release/PACKAGED-WHISPER-SMOKE.json
          Copy-Item _ci/danger.json release/PACKAGED-DANGERSENSE-SMOKE.json
          Copy-Item _ci/executioner.json release/PACKAGED-EXECUTIONER-SMOKE.json
          Compress-Archive -Path release/* -DestinationPath D4WhisperHunter-0.5.0-Windows-x64.zip -Force
          (Get-FileHash D4WhisperHunter-0.5.0-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content D4WhisperHunter-0.5.0-Windows-x64.sha256

      - name: Upload verified Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: D4WhisperHunter-0.5.0-Windows-x64
          path: |
            buildsrc/D4WhisperHunter-0.5.0-Windows-x64.zip
            buildsrc/D4WhisperHunter-0.5.0-Windows-x64.sha256
          if-no-files-found: error
          retention-days: 30
