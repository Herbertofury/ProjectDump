name: D4 Whisper Hunter 0.4.0 Map Reliability

on:
  workflow_dispatch:
  push:
    branches:
      - build/d4-whisper-hunter-0.4.0-map-reliability
    paths:
      - 'projects/d4-whisper-hunter/0.4.0/**'
      - '.github/workflows/d4-whisper-hunter-040-map-reliability.yml'

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout durable base and patch
        uses: actions/checkout@v5

      - name: Reconstruct verified 0.3.0 base and apply exact 0.4.0 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null

          $baseParts = Get-ChildItem 'projects/d4-whisper-hunter/0.3.0/source.b64.part*' | Sort-Object Name
          if ($baseParts.Count -ne 4) { throw "Expected 4 base parts, got $($baseParts.Count)" }
          $base64 = (($baseParts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join '')
          $baseBytes = [Convert]::FromBase64String($base64)
          [IO.File]::WriteAllBytes('D4WhisperHunter-0.3.0-source.tar.xz', $baseBytes)
          $baseSha = (Get-FileHash 'D4WhisperHunter-0.3.0-source.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baseSha -ne '5bbf54473aaf35b2eb645eb37ac298b1c73000c85fd6e6dd070df36e0560c32d') {
            throw "0.3.0 base SHA mismatch: $baseSha"
          }
          tar -xJf 'D4WhisperHunter-0.3.0-source.tar.xz' -C buildsrc
          if (!(Test-Path 'buildsrc/pyproject.toml')) { throw '0.3.0 base extraction failed' }

          $patchParts = Get-ChildItem 'projects/d4-whisper-hunter/0.4.0/upgrade.patch.part*' | Sort-Object Name
          if ($patchParts.Count -ne 3) { throw "Expected 3 patch parts, got $($patchParts.Count)" }
          $patchB64 = (($patchParts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join '')
          $patchBytes = [Convert]::FromBase64String($patchB64)
          [IO.File]::WriteAllBytes('upgrade-0.4.0.patch', $patchBytes)
          $patchSha = (Get-FileHash 'upgrade-0.4.0.patch' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchSha -ne '05ca0cfd6af084b5a4f20bdbb0a1575b367dd691e9fe83002923b1f611d8907e') {
            throw "0.4.0 decoded patch SHA mismatch: $patchSha"
          }

          Push-Location buildsrc
          git init -q
          git apply --check '..\upgrade-0.4.0.patch'
          git apply '..\upgrade-0.4.0.patch'
          if ((Select-String -Path pyproject.toml -Pattern 'version = "0.4.0"' -SimpleMatch) -eq $null) {
            throw '0.4.0 patch did not update project version'
          }
          Pop-Location

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install production and build dependencies
        working-directory: buildsrc
        run: python -m pip install -r requirements-build.txt

      - name: Compile and run 0.4.0 regression suite
        working-directory: buildsrc
        run: |
          python -m compileall -q whisper_hunter d4_whisper_hunter.py tests
          python -m pytest -q

      - name: Fetch and verify permitted upstream Sanctuary anchor
        working-directory: buildsrc
        run: python scripts/fetch_upstream_map.py

      - name: Verify donor map bytes before packaging
        working-directory: buildsrc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'assets\map_5_small.jpg'
          if (!(Test-Path $p)) { throw 'map_5_small.jpg missing after fetch' }
          if ((Get-Item $p).Length -ne 4424290) { throw "Unexpected donor map size" }
          python -c "from pathlib import Path; from whisper_hunter.assets import verify_map; p=Path('assets/map_5_small.jpg'); assert verify_map(p); print('donor map integrity PASS', p)"

      - name: Verify Windows DangerSense sound cue dispatch remains intact
        working-directory: buildsrc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import winsound
          from whisper_hunter.audio import DangerSoundEngine
          from whisper_hunter.config import Config
          from whisper_hunter.danger import DangerEvent

          cfg = Config(danger_sound_enabled=True, danger_sound_cooldown_s=1.2, danger_urgent_sound_cooldown_s=.48)
          engine = DangerSoundEngine(cfg)
          calls = []
          original = winsound.PlaySound
          winsound.PlaySound = lambda path, flags: calls.append(Path(path).name)
          try:
              slash = DangerEvent(1, "slash", 3, .95, (960.,540.), (900,500,120,40), ((900.,500.),(1020.,500.),(1020.,540.)), 0., eta_seconds=.25)
              assert engine.alert(slash, 0.)
              engine.gate.reset()
              boom = DangerEvent(2, "explosion", 3, .99, (960.,540.), (830,410,260,260), ((830.,410.),(1090.,410.),(1090.,670.)), 0., eta_seconds=0.)
              assert engine.alert(boom, 1.)
          finally:
              winsound.PlaySound = original
          assert calls == ["slash.wav", "explosion.wav"], calls
          print("DangerSense sound dispatch PASS", calls)
          '@ | python -

      - name: Build one-file Windows executable with bundled map
        working-directory: buildsrc
        run: pyinstaller --noconfirm --clean --onefile --windowed --name D4WhisperHunter --collect-all cv2 --add-data "assets/map_5_small.jpg;assets" d4_whisper_hunter.py

      - name: Prove packaged EXE uses bundled map with empty cache
        working-directory: buildsrc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:D4WH_MAP_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:D4WH_BUNDLE_ROOT -ErrorAction SilentlyContinue
          $env:APPDATA = (Join-Path (Resolve-Path '.').Path '_isolated-appdata')
          Remove-Item $env:APPDATA -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          & '.\dist\D4WhisperHunter.exe' --asset-check | Tee-Object -FilePath '_asset-check.json'
          if ($LASTEXITCODE -ne 0) { throw "Packaged asset check returned $LASTEXITCODE" }
          $result = Get-Content '_asset-check.json' -Raw | ConvertFrom-Json
          if (-not [bool]$result.verified) { throw 'Packaged donor map failed integrity verification' }
          if ($result.source -ne 'bundled') { throw "Expected bundled source with empty cache, got $($result.source)" }

      - name: Create deterministic Whisper and DangerSense fixtures
        working-directory: buildsrc
        run: python tests/make_ci_fixture.py --out _ci

      - name: Smoke-test packaged Whisper path
        working-directory: buildsrc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:D4WH_MAP_PATH = (Resolve-Path '_ci/fixture-map.png').Path
          & '.\dist\D4WhisperHunter.exe' --input '_ci/fixture-query.png' --output '_ci/annotated.png' | Tee-Object -FilePath '_ci/whisper.json'
          if ($LASTEXITCODE -ne 0) { throw "Whisper smoke returned $LASTEXITCODE" }
          $result = Get-Content '_ci/whisper.json' -Raw | ConvertFrom-Json
          if (-not $result.registered) { throw 'Packaged EXE failed map registration' }
          $favors = @($result.candidates | ForEach-Object { [int]$_.favor } | Sort-Object)
          if (($favors -join ',') -ne '1,3,5') { throw "Expected 1,3,5 Favor; got $($favors -join ',')" }
          if (@($result.tracked).Count -ne 3) { throw "Expected 3 tracked Whispers" }
          if (!(Test-Path '_ci/annotated.png')) { throw 'Whisper annotated output missing' }

      - name: Smoke-test packaged DangerSense path
        working-directory: buildsrc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:D4WH_MAP_PATH -ErrorAction SilentlyContinue
          & '.\dist\D4WhisperHunter.exe' --danger-input '_ci/fixture-danger.png' --danger-output '_ci/danger-annotated.png' | Tee-Object -FilePath '_ci/danger.json'
          if ($LASTEXITCODE -ne 0) { throw "DangerSense smoke returned $LASTEXITCODE" }
          $result = Get-Content '_ci/danger.json' -Raw | ConvertFrom-Json
          if (@($result.danger_events).Count -lt 1) { throw 'DangerSense produced no danger events' }
          $top = @($result.danger_events)[0]
          if ($top.kind -ne 'explosion' -or [int]$top.level -ne 3 -or -not [bool]$top.urgent) {
            throw "Unexpected DangerSense top event: $($top | ConvertTo-Json -Compress)"
          }

      - name: Assemble verified 0.4.0 Windows bundle
        working-directory: buildsrc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/D4WhisperHunter.exe release/
          Copy-Item README.md,NOTICE.md,LICENSE release/
          New-Item -ItemType Directory -Force -Path release/THIRD_PARTY_LICENSES | Out-Null
          Copy-Item THIRD_PARTY_LICENSES/* release/THIRD_PARTY_LICENSES/
          Copy-Item _asset-check.json release/PACKAGED-BUNDLED-MAP-CHECK.json
          Copy-Item _ci/whisper.json release/PACKAGED-WHISPER-SMOKE.json
          Copy-Item _ci/danger.json release/PACKAGED-DANGERSENSE-SMOKE.json
          Compress-Archive -Path release/* -DestinationPath D4WhisperHunter-0.4.0-Windows-x64.zip -Force
          (Get-FileHash D4WhisperHunter-0.4.0-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content D4WhisperHunter-0.4.0-Windows-x64.sha256

      - name: Upload verified 0.4.0 Windows build
        uses: actions/upload-artifact@v4
        with:
          name: D4WhisperHunter-0.4.0-Windows-x64
          path: |
            buildsrc/D4WhisperHunter-0.4.0-Windows-x64.zip
            buildsrc/D4WhisperHunter-0.4.0-Windows-x64.sha256
          if-no-files-found: error
          retention-days: 30
