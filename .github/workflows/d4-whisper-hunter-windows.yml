name: D4 Whisper Hunter Windows

on:
  workflow_dispatch:
  push:
    branches:
      - build/d4-whisper-hunter-0.2.1
    paths:
      - 'projects/d4-whisper-hunter/0.2.1/**'
      - '.github/workflows/d4-whisper-hunter-windows.yml'

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout durable payload
        uses: actions/checkout@v5

      - name: Reconstruct exact 0.2.1 source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'projects/d4-whisper-hunter/0.2.1'
          $parts = Get-ChildItem "$root/source.b64.part*" | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 source parts, got $($parts.Count)" }
          $b64 = (($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join '')
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("$root/D4WhisperHunter-0.2.1-source.tar.xz", $bytes)
          $sha = (Get-FileHash "$root/D4WhisperHunter-0.2.1-source.tar.xz" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '250e86dc962322e71d29efed7a6cbed1ae0b5049b71e7b50462066bbfc55e3a6') {
            throw "Source SHA-256 mismatch: $sha"
          }
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          tar -xJf "$root/D4WhisperHunter-0.2.1-source.tar.xz" -C buildsrc
          if (!(Test-Path 'buildsrc/D4WhisperHunter/pyproject.toml')) { throw 'Source extraction failed' }

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install current production/build dependencies
        working-directory: buildsrc/D4WhisperHunter
        run: python -m pip install -r requirements-build.txt

      - name: Compile and run regression suite
        working-directory: buildsrc/D4WhisperHunter
        run: |
          python -m compileall -q whisper_hunter d4_whisper_hunter.py tests
          python -m pytest -q

      - name: Build one-file Windows executable
        working-directory: buildsrc/D4WhisperHunter
        run: pyinstaller --noconfirm --clean --onefile --windowed --name D4WhisperHunter --collect-all cv2 d4_whisper_hunter.py

      - name: Create deterministic packaged-runtime fixture
        working-directory: buildsrc/D4WhisperHunter
        run: python tests/make_ci_fixture.py --out _ci

      - name: Smoke-test packaged EXE end-to-end
        working-directory: buildsrc/D4WhisperHunter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:D4WH_MAP_PATH = (Resolve-Path '_ci/fixture-map.png').Path
          & '.\dist\D4WhisperHunter.exe' --input '_ci/fixture-query.png' --output '_ci/annotated.png' | Tee-Object -FilePath '_ci/headless.json'
          if ($LASTEXITCODE -ne 0) { throw "Packaged executable returned $LASTEXITCODE" }
          if (!(Test-Path '_ci/annotated.png')) { throw 'Packaged executable did not create annotated output' }
          if ((Get-Item '_ci/annotated.png').Length -lt 1000) { throw 'Annotated output is unexpectedly small' }
          $result = Get-Content '_ci/headless.json' -Raw | ConvertFrom-Json
          if (-not $result.registered) { throw 'Packaged EXE failed map registration' }
          $favors = @($result.candidates | ForEach-Object { [int]$_.favor } | Sort-Object)
          if (($favors -join ',') -ne '1,3,5') { throw "Expected 1,3,5 Favor detections; got $($favors -join ',')" }
          if (@($result.tracked).Count -ne 3) { throw "Expected 3 tracked Whispers" }

      - name: Assemble ad-free Windows bundle
        working-directory: buildsrc/D4WhisperHunter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/D4WhisperHunter.exe release/
          Copy-Item README.md,NOTICE.md,LICENSE release/
          New-Item -ItemType Directory -Force -Path release/THIRD_PARTY_LICENSES | Out-Null
          Copy-Item THIRD_PARTY_LICENSES/* release/THIRD_PARTY_LICENSES/
          Copy-Item _ci/headless.json release/PACKAGED-EXE-SMOKE.json
          Compress-Archive -Path release/* -DestinationPath D4WhisperHunter-0.2.1-Windows-x64.zip -Force
          (Get-FileHash D4WhisperHunter-0.2.1-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content D4WhisperHunter-0.2.1-Windows-x64.sha256

      - name: Upload verified Windows build
        uses: actions/upload-artifact@v4
        with:
          name: D4WhisperHunter-0.2.1-Windows-x64
          path: |
            buildsrc/D4WhisperHunter/D4WhisperHunter-0.2.1-Windows-x64.zip
            buildsrc/D4WhisperHunter/D4WhisperHunter-0.2.1-Windows-x64.sha256
          if-no-files-found: error
          retention-days: 30
