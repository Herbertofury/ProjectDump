name: Async 1.20.1 Ultimate

on:
  push:
    branches: [async-1.20.1-ultimate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-forge:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout project harness
        uses: actions/checkout@v4

      - name: Checkout canonical HMT source
        uses: actions/checkout@v4
        with:
          repository: JustHari01/HariMultiThread
          ref: f381611c2d71a85192e2028f9e30c03823a6482b
          path: upstream
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install shader compiler and Vulkan software runtime
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools mesa-vulkan-drivers vulkan-tools zip

      - name: Clean accidental upstream build state
        shell: bash
        run: |
          rm -rf upstream/**/bin upstream/**/build upstream/**/.gradle upstream/buildSrc/.gradle upstream/buildSrc/build || true
          chmod +x upstream/gradlew

      - name: Verify and record upstream identity
        shell: bash
        working-directory: upstream
        run: |
          test "$(git rev-parse HEAD)" = "f381611c2d71a85192e2028f9e30c03823a6482b"
          git rev-parse HEAD > ../UPSTREAM_SHA.txt

      - name: Apply deterministic release layers
        shell: bash
        run: |
          python3 minecraft/async-1.20.1-ultimate/apply_overlay.py \
            upstream minecraft/async-1.20.1-ultimate/overlay
          python3 minecraft/async-1.20.1-ultimate/apply_hardening.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_lifecycle.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_platform.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_interop.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_lwjgl_runtime.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_backend_architecture.py \
            upstream minecraft/async-1.20.1-ultimate/backend-overlay
          python3 minecraft/async-1.20.1-ultimate/apply_spawn_interop.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_world_batch.py upstream
          python3 minecraft/async-1.20.1-ultimate/apply_mixin_packaging.py upstream
          git -C upstream diff --check

      - name: Verify hardening and production packaging invariants
        shell: bash
        run: |
          ! grep -F 'entityList.parallelStream()' upstream/common/src/main/java/com/axalotl/async/common/mixin/spawn/NaturalSpawnerMixin.java
          ! grep -F 'CompletableFuture.runAsync' upstream/common/src/main/java/com/axalotl/async/common/mixin/server/ServerChunkCacheMixin.java
          ! grep -F 'entity.spawn.LocalMobCapCalculatorMixin' upstream/common/src/main/resources/harimt.common.mixins.json
          ! grep -F 'entity.spawn.PotentialCalculatorMixin' upstream/common/src/main/resources/harimt.common.mixins.json
          grep -F 'EnderDragon.class' upstream/common/src/main/java/com/axalotl/async/common/ParallelProcessor.java
          grep -F 'availableProcessors() - 1' upstream/common/src/main/java/com/axalotl/async/common/config/AsyncConfig.java
          grep -F 'world.PalettedContainerMixin' upstream/common/src/main/resources/harimt.common.mixins.json
          grep -F 'GpuPushBatch.clear();' upstream/common/src/main/java/com/axalotl/async/common/ParallelProcessor.java
          grep -F 'GpuPushBatch.beginBatch(world);' upstream/common/src/main/java/com/axalotl/async/common/ParallelProcessor.java
          grep -F 'GpuPushBatch.endBatch(world);' upstream/common/src/main/java/com/axalotl/async/common/ParallelProcessor.java
          grep -F 'isBatchActive(level)' upstream/common/src/main/java/com/axalotl/async/common/gpu/GpuPushBatch.java
          grep -F 'forge_version=47.4.23' upstream/gradle.properties
          grep -F 'isModLoaded("c2meforge")' upstream/common/src/main/java/com/axalotl/async/common/AsyncCommon.java
          grep -F 'waitWorld.getChunkSource().pollTask()' upstream/common/src/main/java/com/axalotl/async/common/ParallelProcessor.java
          ! grep -F 'for (ServerLevel lvl : server.getAllLevels())' upstream/common/src/main/java/com/axalotl/async/common/ParallelProcessor.java
          grep -F 'harimt$spawnTasks.add(() -> NaturalSpawner.spawnForChunk(' upstream/common/src/main/java/com/axalotl/async/common/mixin/server/ServerChunkCacheMixin.java
          ! grep -F 'SpawnChunkContext' upstream/common/src/main/java/com/axalotl/async/common/mixin/server/ServerChunkCacheMixin.java
          ! grep -F 'spawn.NaturalSpawnerScheduledChunkMixin' upstream/common/src/main/resources/harimt.common.mixins.json
          ! test -e upstream/common/src/main/java/com/axalotl/async/common/mixin/spawn/NaturalSpawnerScheduledChunkMixin.java
          ! test -e upstream/common/src/main/java/com/axalotl/async/common/spawn/SpawnChunkContext.java
          ! test -e upstream/common/src/main/java/com/axalotl/async/common/gpu/vulkan/VkDeviceManager.java
          ! test -e upstream/common/src/main/java/com/axalotl/async/common/gpu/vulkan/VkBufferManager.java
          ! test -e upstream/common/src/main/java/com/axalotl/async/common/gpu/vulkan/VkComputePipeline.java
          ! test -e upstream/vulkan-backend/build.gradle
          grep -F 'harimtVulkanBackend' upstream/forge/build.gradle
          grep -F 'compile-checked isolated LWJGL' upstream/common/src/main/java/com/axalotl/async/common/gpu/GpuEntityModule.java
          ! grep -R -F 'Class.forName("org.lwjgl.vulkan' upstream/common/src/main/java
          grep -F "'MixinConfigs': 'harimt.common.mixins.json,harimt.forge.mixins.json'" upstream/forge/build.gradle

      - name: Compile Vulkan broad-phase shader
        shell: bash
        run: |
          shader=upstream/common/src/main/resources/assets/async/shaders/collision_broadphase.comp
          spv="${shader}.spv"
          glslangValidator -V "$shader" -o "$spv"
          test -s "$spv"
          test "$(xxd -p -l 4 "$spv")" = "03022307"
          grep -F 'bool laneActive = gid < uint(entityCount);' "$shader"
          grep -F 'binding = 8' "$shader"

      - name: Vulkan environment receipt
        shell: bash
        run: |
          mkdir -p evidence/runtime
          vulkaninfo --summary | tee evidence/runtime/vulkaninfo-summary.txt

      - name: Compile backend and build Forge 1.20.1 release
        shell: bash
        working-directory: upstream
        run: ./gradlew --no-daemon clean :forge:harimtVulkanBackendJar :forge:build --stacktrace

      - name: Verify production JAR, mixin manifest and isolated backend
        shell: bash
        run: |
          mapfile -t jars < <(find upstream/forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' ! -name 'harimt-vulkan-backend*' | sort)
          test "${#jars[@]}" -ge 1
          jarfile="${jars[0]}"
          echo "$jarfile" > RELEASE_JAR_PATH.txt
          jar tf "$jarfile" | grep -Fx 'harimt.common.mixins.json'
          jar tf "$jarfile" | grep -Fx 'harimt.forge.mixins.json'
          jar tf "$jarfile" | grep -Fx 'harimt.refmap.json'
          manifest="$(unzip -p "$jarfile" META-INF/MANIFEST.MF | tr -d '\r')"
          printf '%s\n' "$manifest" | grep -Fx 'MixinConfigs: harimt.common.mixins.json,harimt.forge.mixins.json'
          jar tf "$jarfile" | grep -Fx 'assets/async/shaders/collision_broadphase.comp.spv'
          jar tf "$jarfile" | grep -Fx 'com/axalotl/async/common/gpu/GpuPushBatch.class'
          jar tf "$jarfile" | grep -Fx 'com/axalotl/async/common/mixin/entity/LivingEntityPushMixin.class'
          jar tf "$jarfile" | grep -Fx 'com/axalotl/async/common/gpu/vulkan/VkRuntime.class'
          jar tf "$jarfile" | grep -Fx 'com/axalotl/async/common/gpu/vulkan/VulkanCollisionBackend.class'
          if jar tf "$jarfile" | grep -Fqx 'com/axalotl/async/common/spawn/SpawnChunkContext.class'; then
            echo 'obsolete SpawnChunkContext must not be packaged on Forge 1.20.1' >&2
            exit 1
          fi
          if jar tf "$jarfile" | grep -Fqx 'com/axalotl/async/common/mixin/spawn/NaturalSpawnerScheduledChunkMixin.class'; then
            echo 'obsolete NaturalSpawnerScheduledChunkMixin must not be packaged on Forge 1.20.1' >&2
            exit 1
          fi
          jar tf "$jarfile" | grep -Fx 'META-INF/harimt-libs/harimt-vulkan-backend-3.3.1.jar'
          jar tf "$jarfile" | grep -Fx 'META-INF/harimt-libs/lwjgl-3.3.1.jar'
          jar tf "$jarfile" | grep -Fx 'META-INF/harimt-libs/lwjgl-vulkan-3.3.1.jar'
          jar tf "$jarfile" | grep -Fx 'META-INF/harimt-libs/lwjgl-3.3.1-natives-linux.jar'
          jar tf "$jarfile" | grep -Fx 'META-INF/harimt-libs/lwjgl-3.3.1-natives-windows.jar'
          unzip -p "$jarfile" META-INF/harimt-libs/harimt-vulkan-backend-3.3.1.jar > /tmp/harimt-vulkan-backend.jar
          jar tf /tmp/harimt-vulkan-backend.jar | grep -Fx 'com/axalotl/async/vulkanruntime/LwjglVulkanBackend.class'
          if unzip -p "$jarfile" META-INF/jarjar/metadata.json 2>/dev/null | grep -Fq 'lwjgl-vulkan'; then
            echo 'lwjgl-vulkan must not be exposed as a Forge JarJar module' >&2
            exit 1
          fi
          unzip -p "$jarfile" META-INF/mods.toml | grep -F 'GPL-3.0-only'
          unzip -p "$jarfile" META-INF/mods.toml | grep -F 'HariMultiThread Ultimate'

      - name: Install real Forge 47.4.23 dedicated server
        shell: bash
        run: |
          mkdir -p qa-server evidence/runtime
          curl -fL --retry 3 \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar' \
            -o forge-1.20.1-47.4.23-installer.jar
          (
            cd qa-server
            java -jar ../forge-1.20.1-47.4.23-installer.jar --installServer \
              > ../evidence/runtime/forge-server-install.log 2>&1
          )
          test -f qa-server/run.sh
          chmod +x qa-server/run.sh
          mkdir -p qa-server/mods
          cp "$(cat RELEASE_JAR_PATH.txt)" qa-server/mods/HariMultiThread-Ultimate.jar
          printf 'eula=true\n' > qa-server/eula.txt
          cat > qa-server/server.properties <<'EOF'
          online-mode=false
          level-name=world
          level-seed=8675309
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          motd=HariMultiThread Ultimate Runtime QA
          EOF

      - name: Packaged Forge sustained Vulkan, fallback, save, restart gate
        shell: bash
        run: |
          python3 minecraft/async-1.20.1-ultimate/runtime_server_qa.py \
            qa-server evidence/runtime

      - name: Package merged source and verification evidence
        if: always()
        shell: bash
        run: |
          rm -rf release merged-source
          mkdir -p release evidence merged-source
          cp UPSTREAM_SHA.txt evidence/ || true
          (cd upstream && git diff --binary) > evidence/UPSTREAM-TO-ULTIMATE.patch || true
          (cd upstream && git status --porcelain=v1) > evidence/upstream-status.txt || true
          cp RELEASE_JAR_PATH.txt evidence/ 2>/dev/null || true
          if test -f RELEASE_JAR_PATH.txt; then
            jarfile="$(cat RELEASE_JAR_PATH.txt)"
            cp "$jarfile" release/HariMultiThread-Ultimate-1.20.1-2.1.0-noxviola.1.jar
          fi
          rsync -a \
            --exclude='.git/' --exclude='.gradle/' --exclude='build/' --exclude='bin/' \
            upstream/ merged-source/
          (cd merged-source && zip -qr ../release/HariMultiThread-Ultimate-1.20.1-2.1.0-noxviola.1-SOURCE.zip .)
          cp -r minecraft/async-1.20.1-ultimate evidence/project-overlay
          sha256sum release/* > release/SHA256SUMS.txt 2>/dev/null || true
          cp release/SHA256SUMS.txt evidence/ 2>/dev/null || true

      - name: Upload release candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-1.20.1-ultimate-release-candidate
          path: |
            release/
            evidence/
          if-no-files-found: error
