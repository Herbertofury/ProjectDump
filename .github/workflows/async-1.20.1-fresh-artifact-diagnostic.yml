name: Async 1.20.1 Fresh Artifact Diagnostic

on:
  push:
    branches: [async-1.20.1-ultimate-fresh-diag]
    paths: [.github/workflows/async-1.20.1-fresh-artifact-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fresh-artifact-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Vulkan runtime
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools

      - name: Download exact current packaged JAR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reused
          gh run download 34060372089 \
            --repo Herbertofury/ProjectDump \
            --name async-1.20.1-ultimate-release-candidate \
            --dir reused
          jarfile="$(find reused/release -maxdepth 1 -type f -name 'HariMultiThread-Ultimate-1.20.1-2.1.0-noxviola.1.jar' -print -quit)"
          test -s "$jarfile"
          test "$(sha256sum "$jarfile" | awk '{print $1}')" = "73e44a020d1a4bcf81d06e3af9ef51418b32988cf72c19626c977ab7b9059306"
          echo "$jarfile" > REUSED_JAR_PATH.txt
          sha256sum "$jarfile" | tee reused-jar.sha256
          unzip -p "$jarfile" META-INF/MANIFEST.MF | tr -d '\r' | tee fresh-manifest.txt
          grep -Fx 'MixinConfigs: harimt.common.mixins.json,harimt.forge.mixins.json' fresh-manifest.txt
          jar tf "$jarfile" | grep -Fx 'harimt.common.mixins.json'
          jar tf "$jarfile" | grep -Fx 'harimt.forge.mixins.json'
          if jar tf "$jarfile" | grep -Eq '(^|/)harimt\.refmap\.json$'; then
            echo 'refmap=present' | tee refmap-status.txt
          else
            echo 'refmap=absent' | tee refmap-status.txt
          fi

      - name: Install Forge 47.4.23 server
        shell: bash
        run: |
          mkdir -p diag-server/diag-evidence
          curl -fL --retry 3 \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar' \
            -o forge-installer.jar
          (cd diag-server && java -jar ../forge-installer.jar --installServer > diag-evidence/forge-install.log 2>&1)
          mkdir -p diag-server/mods
          cp "$(cat REUSED_JAR_PATH.txt)" diag-server/mods/HariMultiThread-Ultimate.jar
          printf 'eula=true\n' > diag-server/eula.txt
          cat > diag-server/server.properties <<'EOF'
          online-mode=false
          level-name=world
          level-seed=8675309
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          motd=HariMultiThread Fresh Artifact Diagnostic
          EOF

      - name: Run packaged server with Mixin export
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess, threading, time
          from pathlib import Path

          root = Path('diag-server')
          out = root / 'diag-evidence' / 'runtime-diagnostic.log'
          env = os.environ.copy()
          env['JDK_JAVA_OPTIONS'] = (
              '-Dharimt.vulkan.allowCpuDevice=true '
              '-Dmixin.debug.verbose=true '
              '-Dmixin.debug.export=true '
              '-Dmixin.debug.countInjections=true '
              '-Dmixin.dumpTargetOnFailure=true '
              '-Dmixin.debug.export.filter=net.minecraft.world.entity.LivingEntity'
          )
          lines = []
          p = subprocess.Popen(['bash', 'run.sh', 'nogui'], cwd=root,
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                               stderr=subprocess.STDOUT, text=True, bufsize=1, env=env)
          assert p.stdin and p.stdout
          ready = threading.Event()
          def reader():
              for line in p.stdout:
                  print(line, end='', flush=True)
                  lines.append(line)
                  if 'Done (' in line:
                      ready.set()
          t = threading.Thread(target=reader, daemon=True)
          t.start()
          if not ready.wait(180):
              p.terminate()
              try:
                  p.wait(timeout=15)
              except subprocess.TimeoutExpired:
                  p.kill()
              t.join(timeout=5)
              out.write_text(''.join(lines), encoding='utf-8')
              raise SystemExit('server did not reach Done marker')

          def send(cmd):
              print('[DIAG] >', cmd, flush=True)
              p.stdin.write(cmd + '\n')
              p.stdin.flush()

          send('gamerule doMobSpawning false')
          send('forceload add 0 0')
          send('kill @e[tag=harimt_fresh_diag]')
          send('summon minecraft:cow 1.5 200 1.5 {Tags:["harimt_fresh_diag"],NoGravity:1b,Silent:1b,PersistenceRequired:1b,Invulnerable:1b,Fire:200s}')
          send('summon minecraft:cow 1.5 200 1.5 {Tags:["harimt_fresh_diag"],NoGravity:1b,Silent:1b,PersistenceRequired:1b,Invulnerable:1b,Fire:200s}')
          time.sleep(1.0)
          send('async stats')
          send('data get entity @e[tag=harimt_fresh_diag,limit=1,sort=nearest] Pos')
          send('data get entity @e[tag=harimt_fresh_diag,limit=1,sort=nearest] Fire')
          time.sleep(3.0)
          send('async stats')
          send('data get entity @e[tag=harimt_fresh_diag,limit=1,sort=nearest] Pos')
          send('data get entity @e[tag=harimt_fresh_diag,limit=1,sort=nearest] Fire')
          time.sleep(2.0)
          send('stop')
          rc = p.wait(timeout=60)
          t.join(timeout=5)
          out.write_text(''.join(lines), encoding='utf-8')
          if rc != 0:
              raise SystemExit(f'server exit {rc}')
          PY

      - name: Prove HMT mixin selection and transformed push hook
        shell: bash
        run: |
          log=diag-server/diag-evidence/runtime-diagnostic.log
          grep -E 'Selecting config harimt\.(common|forge)\.mixins\.json' "$log" | tee diag-server/diag-evidence/mixin-selection.txt
          exported="$(find diag-server/.mixin.out -type f -path '*/net/minecraft/world/entity/LivingEntity.class' -print -quit)"
          test -n "$exported"
          echo "$exported" | tee diag-server/diag-evidence/transformed-livingentity-path.txt
          javap -c -p "$exported" | tee diag-server/diag-evidence/LivingEntity.transformed.javap.txt
          grep -F 'GpuPushBatch.shouldDefer' diag-server/diag-evidence/LivingEntity.transformed.javap.txt
          grep -F 'GpuPushBatch.defer' diag-server/diag-evidence/LivingEntity.transformed.javap.txt

      - name: Summarize decisive evidence
        if: always()
        shell: bash
        run: |
          log=diag-server/diag-evidence/runtime-diagnostic.log
          echo '=== Mixin selection/refmap/injection ==='
          grep -Ei 'Selecting config harimt|refmap|LivingEntityPushMixin|GpuPushBatch|MixinApplyError|InjectionError|InvalidInjection' "$log" | tail -n 180 || true
          echo '=== Runtime stats / Vulkan ==='
          grep -Ei 'Performance Statistics|Entities:|Pool Threads:|Circuit Breaker:|GPU Entity Module|Vulkan collision|Cow has the following entity data' "$log" | tail -n 180 || true
          echo '=== transformed LivingEntity HMT calls ==='
          grep -n -F 'GpuPushBatch.' diag-server/diag-evidence/LivingEntity.transformed.javap.txt 2>/dev/null || true

      - name: Upload fresh diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-fresh-artifact-diagnostic-evidence
          path: |
            diag-server/diag-evidence/
            reused-jar.sha256
            fresh-manifest.txt
            refmap-status.txt
          if-no-files-found: error
