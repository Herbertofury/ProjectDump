name: Async 1.20.1 Ultimate Performance Lab - Ultra Final Candidate

on:
  push:
    branches: [async-1.20.1-ultimate-perf-lab-20260913-ultra-run]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-forge-ultra-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout performance harness
        uses: actions/checkout@v4

      - name: Verify and unpack max experiment tooling
        shell: bash
        run: |
          set -euo pipefail
          bundle=minecraft/async-1.20.1-ultimate/max-prep-bundle.tar.gz.b64
          base64 -d "$bundle" > /tmp/hmt-max-prep.tar.gz
          echo "f3fcb3554aeed2efea89c87994509ceea6f31ea0d4703d000554be7995a2b00a  /tmp/hmt-max-prep.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hmt-max-prep.tar.gz -C minecraft/async-1.20.1-ultimate --exclude=max_benchmark_patch.py
          python3 -m py_compile \
            minecraft/async-1.20.1-ultimate/apply_perf_source_lanes.py \
            minecraft/async-1.20.1-ultimate/apply_perf_reuse_pair_arrays.py \
            minecraft/async-1.20.1-ultimate/apply_perf_batch_state.py \
            minecraft/async-1.20.1-ultimate/apply_perf_array_work_routing.py \
            minecraft/async-1.20.1-ultimate/apply_perf_max_stack.py \
            minecraft/async-1.20.1-ultimate/apply_perf_instrumentation_max.py \
            minecraft/async-1.20.1-ultimate/max_benchmark_patch.py \
            minecraft/async-1.20.1-ultimate/compare_perf_results_max.py
          ultra_bundle=minecraft/async-1.20.1-ultimate/ultra-final-bundle.tar.gz.b64
          base64 -d "$ultra_bundle" > /tmp/hmt-ultra-final.tar.gz
          echo "77946027920699fc3585c875d1c1f990d94b33b297150eb621b2b6026995a737  /tmp/hmt-ultra-final.tar.gz" | sha256sum -c -
          tar -xzf /tmp/hmt-ultra-final.tar.gz -C minecraft/async-1.20.1-ultimate
          python3 -m py_compile \
            minecraft/async-1.20.1-ultimate/apply_perf_array_parallel_batches.py \
            minecraft/async-1.20.1-ultimate/apply_perf_wait_loop.py \
            minecraft/async-1.20.1-ultimate/apply_perf_packed_source_only.py \
            minecraft/async-1.20.1-ultimate/apply_perf_worker_marker.py \
            minecraft/async-1.20.1-ultimate/apply_perf_ultra_final_stack.py

      - name: Checkout pinned HariMultiThread upstream baseline
        uses: actions/checkout@v4
        with:
          repository: JustHari01/HariMultiThread
          ref: f381611c2d71a85192e2028f9e30c03823a6482b
          path: upstream-baseline
          fetch-depth: 1

      - name: Clone identical candidate source tree
        shell: bash
        run: cp -a upstream-baseline upstream-candidate

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native benchmark toolchain
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools mesa-vulkan-drivers vulkan-tools zip

      - name: Clean copied upstream build state
        shell: bash
        run: |
          set -euo pipefail
          for root in upstream-baseline upstream-candidate; do
            rm -rf "$root"/**/bin "$root"/**/build "$root"/**/.gradle "$root"/buildSrc/.gradle "$root"/buildSrc/build || true
            chmod +x "$root/gradlew"
            test "$(git -C "$root" rev-parse HEAD)" = "f381611c2d71a85192e2028f9e30c03823a6482b"
          done

      - name: Apply identical verified 2.1.1 production layers
        shell: bash
        run: |
          set -euo pipefail
          apply_layers() {
            root="$1"
            python3 minecraft/async-1.20.1-ultimate/apply_overlay.py "$root" minecraft/async-1.20.1-ultimate/overlay
            python3 minecraft/async-1.20.1-ultimate/apply_hardening.py "$root"
            python3 minecraft/async-1.20.1-ultimate/apply_lifecycle.py "$root"
            python3 minecraft/async-1.20.1-ultimate/apply_platform.py "$root"
            python3 minecraft/async-1.20.1-ultimate/apply_interop.py "$root"
            python3 minecraft/async-1.20.1-ultimate/apply_lwjgl_runtime.py "$root"
            python3 minecraft/async-1.20.1-ultimate/apply_backend_architecture.py "$root" minecraft/async-1.20.1-ultimate/backend-overlay
            python3 minecraft/async-1.20.1-ultimate/apply_spawn_interop.py "$root"
            python3 minecraft/async-1.20.1-ultimate/apply_world_batch.py "$root"
            python3 minecraft/async-1.20.1-ultimate/apply_spatial_gpu.py "$root"
            python3 minecraft/async-1.20.1-ultimate/apply_mixin_packaging.py "$root"
            git -C "$root" diff --check
          }
          apply_layers upstream-baseline
          apply_layers upstream-candidate

      - name: Apply identical max-benchmark telemetry and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          for root in upstream-baseline upstream-candidate; do
            python3 minecraft/async-1.20.1-ultimate/apply_perf_instrumentation_max.py "$root"
            python3 minecraft/async-1.20.1-ultimate/apply_ci_repository_hygiene.py "$root"
            ! grep -R -F 'maven.bawnorton.com' "$root/common/build.gradle" "$root/forge/build.gradle" "$root/fabric/build.gradle" "$root/buildSrc/src/main/groovy/multiloader-common.gradle"
            git -C "$root" diff --check
          done

      - name: Apply candidate-only cumulative ultra-final performance stack
        shell: bash
        run: |
          set -euo pipefail
          python3 minecraft/async-1.20.1-ultimate/apply_perf_ultra_final_stack.py upstream-candidate
          git -C upstream-candidate diff --check
          grep -F 'computeGpuCandidates(collisionPopulation, deferred)' upstream-candidate/common/src/main/java/com/axalotl/async/common/gpu/GpuPushBatch.java
          grep -F 'bool laneActive = gid < sourceCount;' upstream-candidate/common/src/main/resources/assets/async/shaders/collision_broadphase.comp
          grep -F 'ensureHostPairCapacity(pairCount)' upstream-candidate/vulkan-backend/src/main/java/com/axalotl/async/vulkanruntime/LwjglVulkanBackend.java
          grep -F 'GpuPushBatch.tryDefer(self)' upstream-candidate/common/src/main/java/com/axalotl/async/common/mixin/entity/LivingEntityPushMixin.java
          grep -F 'AtomicIntegerArray nextIndex' upstream-candidate/common/src/main/java/com/axalotl/async/common/ParallelProcessor.java
          grep -F 'Object[] work = items.toArray();' upstream-candidate/common/src/main/java/com/axalotl/async/common/ParallelProcessor.java
          grep -F 'allDone = true;' upstream-candidate/common/src/main/java/com/axalotl/async/common/ParallelProcessor.java
          grep -F 'sourceSlots.put(entity, -2);' upstream-candidate/common/src/main/java/com/axalotl/async/common/gpu/GpuCollisionDispatcher.java
          grep -F 'ASYNC_WORKER.set(Boolean.TRUE);' upstream-candidate/common/src/main/java/com/axalotl/async/common/ParallelProcessor.java
          ! grep -F 'futures.stream().allMatch(Future::isDone)' upstream-candidate/common/src/main/java/com/axalotl/async/common/ParallelProcessor.java
          ! grep -F 'new ConcurrentLinkedQueue<>(items)' upstream-candidate/common/src/main/java/com/axalotl/async/common/ParallelProcessor.java

      - name: Prepare expanded five-lane benchmark harness
        shell: bash
        run: |
          cp minecraft/async-1.20.1-ultimate/runtime_perf_benchmark.py minecraft/async-1.20.1-ultimate/runtime_perf_benchmark_max.py
          python3 minecraft/async-1.20.1-ultimate/max_benchmark_patch.py minecraft/async-1.20.1-ultimate/runtime_perf_benchmark_max.py
          python3 -m py_compile \
            minecraft/async-1.20.1-ultimate/runtime_perf_benchmark_max.py \
            minecraft/async-1.20.1-ultimate/compare_perf_results_max.py
          grep -F 'dense-256-plus-512-local-nonsources' minecraft/async-1.20.1-ultimate/runtime_perf_benchmark_max.py
          grep -F 'affinity-1024-64-chunks' minecraft/async-1.20.1-ultimate/runtime_perf_benchmark_max.py

      - name: Compile shaders for baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          for root in upstream-baseline upstream-candidate; do
            shader="$root/common/src/main/resources/assets/async/shaders/collision_broadphase.comp"
            spv="${shader}.spv"
            glslangValidator -V "$shader" -o "$spv"
            test -s "$spv"
            test "$(xxd -p -l 4 "$spv")" = "03022307"
          done
          mkdir -p evidence/environment
          vulkaninfo --summary | tee evidence/environment/vulkaninfo-summary.txt
          java -version 2> evidence/environment/java-version.txt
          lscpu > evidence/environment/lscpu.txt

      - name: Build packaged baseline and cumulative candidate Forge JARs
        shell: bash
        run: |
          set -euo pipefail
          for root in upstream-baseline upstream-candidate; do
            (cd "$root" && ./gradlew --no-daemon clean :forge:harimtVulkanBackendJar :forge:build --stacktrace)
          done
          mkdir -p perf-jars
          base="$(find upstream-baseline/forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' ! -name 'harimt-vulkan-backend*' | sort | head -n1)"
          cand="$(find upstream-candidate/forge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' ! -name 'harimt-vulkan-backend*' | sort | head -n1)"
          cp "$base" perf-jars/HariMultiThread-Ultimate-2.1.1-baseline.jar
          cp "$cand" perf-jars/HariMultiThread-Ultimate-ultra-final-candidate.jar
          sha256sum perf-jars/*.jar | tee evidence/benchmark-jar-sha256.txt

      - name: Install one clean Forge 47.4.23 server template
        shell: bash
        run: |
          curl -fL --retry 3 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar' -o forge-installer.jar
          mkdir forge-template
          (cd forge-template && java -jar ../forge-installer.jar --installServer)
          test -f forge-template/run.sh
          chmod +x forge-template/run.sh

      - name: Prepare identical baseline and candidate servers
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline candidate; do
            cp -a forge-template "qa-${variant}"
            mkdir -p "qa-${variant}/mods"
            printf 'eula=true\n' > "qa-${variant}/eula.txt"
            cat > "qa-${variant}/server.properties" <<'EOF'
          online-mode=false
          level-name=world
          level-seed=8675309
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          sync-chunk-writes=true
          motd=HariMultiThread Ultimate Ultra Final Performance Lab
          EOF
          done
          cp perf-jars/HariMultiThread-Ultimate-2.1.1-baseline.jar qa-baseline/mods/HariMultiThread-Ultimate.jar
          cp perf-jars/HariMultiThread-Ultimate-ultra-final-candidate.jar qa-candidate/mods/HariMultiThread-Ultimate.jar

      - name: Benchmark verified 2.1.1 baseline in real Forge server
        shell: bash
        run: python3 minecraft/async-1.20.1-ultimate/runtime_perf_benchmark_max.py qa-baseline evidence/perf/baseline --label 2.1.1-baseline

      - name: Benchmark cumulative max candidate in real Forge server
        shell: bash
        run: python3 minecraft/async-1.20.1-ultimate/runtime_perf_benchmark_max.py qa-candidate evidence/perf/candidate --label ultra-final-candidate

      - name: Enforce expanded measured-gain and no-regression contract
        shell: bash
        run: |
          python3 minecraft/async-1.20.1-ultimate/compare_perf_results_max.py \
            evidence/perf/baseline/benchmark.json evidence/perf/candidate/benchmark.json \
            evidence/perf/MAX-AB-COMPARISON.json | tee evidence/perf/MAX-AB-COMPARISON.txt

      - name: Candidate packaged Forge correctness gate
        shell: bash
        run: |
          cp -a forge-template qa-candidate-correctness
          mkdir -p qa-candidate-correctness/mods evidence/runtime/candidate
          printf 'eula=true\n' > qa-candidate-correctness/eula.txt
          cat > qa-candidate-correctness/server.properties <<'EOF'
          online-mode=false
          level-name=world
          level-seed=8675309
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          motd=HariMultiThread Ultimate Ultra Final Correctness
          EOF
          cp perf-jars/HariMultiThread-Ultimate-ultra-final-candidate.jar qa-candidate-correctness/mods/HariMultiThread-Ultimate.jar
          python3 minecraft/async-1.20.1-ultimate/runtime_server_qa.py qa-candidate-correctness evidence/runtime/candidate

      - name: Upload max-candidate A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-1.20.1-ultimate-ultra-final-evidence
          path: |
            evidence/
            perf-jars/
          if-no-files-found: warn
