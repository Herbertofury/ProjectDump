# Temporary source-seed workflow for Minecraft Mod Vault v0.9.0.
# Artifacts are independently verified before use and this branch is never merged.
name: MMV v0.9.0 official loader, mapping, API, and build-tool seeds

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-mmv-v090-source-seeds.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate official source feeds
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mmv-source-seeds"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cd "$ROOT"
          fetch() {
            local url="$1" output="$2"
            curl --fail --location --retry 5 --retry-all-errors \
              -H 'User-Agent: MinecraftModVault/0.9.0 source-seed-builder' \
              "$url" --output "$output"
            test -s "$output"
          }

          fetch https://piston-meta.mojang.com/mc/game/version_manifest_v2.json mojang-version-manifest-v2.json
          fetch https://meta.fabricmc.net/v2/versions/game fabric-game-versions.json
          fetch https://meta.fabricmc.net/v2/versions/loader fabric-loader-versions.json
          fetch https://meta.quiltmc.org/v3/versions/game quilt-game-versions.json
          fetch https://meta.quiltmc.org/v3/versions/loader quilt-loader-versions.json
          fetch https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml forge-maven-metadata.xml
          fetch https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml neoforge-maven-metadata.xml
          fetch https://maven.neoforged.net/releases/net/neoforged/neoform/maven-metadata.xml neoform-maven-metadata.xml
          fetch https://api.modrinth.com/v2/tag/game_version modrinth-game-versions.json
          fetch https://api.modrinth.com/v2/tag/loader modrinth-loaders.json
          fetch https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml fabric-loom-maven-metadata.xml
          fetch https://maven.minecraftforge.net/net/minecraftforge/gradle/ForgeGradle/maven-metadata.xml forgegradle-maven-metadata.xml
          fetch https://maven.neoforged.net/releases/net/neoforged/gradle/userdev/maven-metadata.xml neogradle-userdev-maven-metadata.xml
          fetch https://maven.neoforged.net/releases/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml moddevgradle-plugin-maven-metadata.xml
          fetch https://maven.fabricmc.net/net/fabricmc/yarn/maven-metadata.xml yarn-maven-metadata.xml
          fetch https://maven.fabricmc.net/net/fabricmc/intermediary/maven-metadata.xml intermediary-maven-metadata.xml
          fetch https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml fabric-api-maven-metadata.xml
          fetch https://maven.quiltmc.org/repository/release/org/quiltmc/quilt-mappings/maven-metadata.xml quilt-mappings-maven-metadata.xml
          fetch https://maven.minecraftforge.net/de/oceanlabs/mcp/mcp_config/maven-metadata.xml mcpconfig-maven-metadata.xml
          fetch https://maven.minecraftforge.net/net/minecraftforge/srgutils/maven-metadata.xml srgutils-maven-metadata.xml
          fetch https://maven.minecraftforge.net/net/minecraftforge/AutoRenamingTool/maven-metadata.xml auto-renaming-tool-maven-metadata.xml
          fetch https://repo.spongepowered.org/repository/maven-public/org/spongepowered/mixin/maven-metadata.xml mixin-maven-metadata.xml
          fetch https://maven.llamalad7.net/com/llamalad7/mixinextras/mixinextras-common/maven-metadata.xml mixinextras-maven-metadata.xml
          fetch https://maven.architectury.dev/dev/architectury/architectury-loom/maven-metadata.xml architectury-loom-maven-metadata.xml

          python3 - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.')
          json_expectations = {
              'mojang-version-manifest-v2.json': ('object', 900),
              'fabric-game-versions.json': ('array', 300),
              'fabric-loader-versions.json': ('array', 100),
              'quilt-game-versions.json': ('array', 200),
              'quilt-loader-versions.json': ('array', 100),
              'modrinth-game-versions.json': ('array', 300),
              'modrinth-loaders.json': ('array', 10),
          }
          summary = {'schemaVersion': 2, 'generatedAt': '2026-08-20T00:00:00Z', 'sources': {}}
          for name, (kind, minimum) in json_expectations.items():
              payload = json.loads((root / name).read_text(encoding='utf-8'))
              if kind == 'object':
                  if not isinstance(payload, dict) or len(payload.get('versions', [])) < minimum:
                      raise RuntimeError(f'{name} failed object validation')
                  count = len(payload['versions'])
              else:
                  if not isinstance(payload, list) or len(payload) < minimum:
                      raise RuntimeError(f'{name} failed array validation')
                  count = len(payload)
              summary['sources'][name] = {'records': count, 'bytes': (root / name).stat().st_size}

          xml_names = [
              'forge-maven-metadata.xml',
              'neoforge-maven-metadata.xml',
              'neoform-maven-metadata.xml',
              'fabric-loom-maven-metadata.xml',
              'forgegradle-maven-metadata.xml',
              'neogradle-userdev-maven-metadata.xml',
              'moddevgradle-plugin-maven-metadata.xml',
              'yarn-maven-metadata.xml',
              'intermediary-maven-metadata.xml',
              'fabric-api-maven-metadata.xml',
              'quilt-mappings-maven-metadata.xml',
              'mcpconfig-maven-metadata.xml',
              'srgutils-maven-metadata.xml',
              'auto-renaming-tool-maven-metadata.xml',
              'mixin-maven-metadata.xml',
              'mixinextras-maven-metadata.xml',
              'architectury-loom-maven-metadata.xml',
          ]
          for name in xml_names:
              tree = ET.parse(root / name)
              versions = tree.findall('.//version')
              if not versions:
                  raise RuntimeError(f'{name} has no Maven versions')
              summary['sources'][name] = {'records': len(versions), 'bytes': (root / name).stat().st_size, 'latest': versions[-1].text or ''}

          with open('SOURCE-SEED-SUMMARY.json', 'w', encoding='utf-8', newline='\n') as output:
              json.dump(summary, output, indent=2, sort_keys=True)
              output.write('\n')
          PY
          sha256sum *.json *.xml > SHA256SUMS.txt
          cat SOURCE-SEED-SUMMARY.json

      - name: Upload verified source seeds
        uses: actions/upload-artifact@v4
        with:
          name: mmv-v090-official-source-seeds
          path: |
            ${{ runner.temp }}/mmv-source-seeds/*.json
            ${{ runner.temp }}/mmv-source-seeds/*.xml
            ${{ runner.temp }}/mmv-source-seeds/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
