name: Publish Potatoptimize Forge 1.20.1 Certified Release

on:
  workflow_run:
    workflows:
      - Potatoptimize Forge 1.20.1 Aggressive Profile QA
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: potatoptimize-forge-1.20.1-parity-safe-r1-publication
  cancel-in-progress: false

jobs:
  publish-certified-release:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.id == 34147720996 && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 45768239855e00e50437c6f9d7d0b814caa731eb
      EXPECTED_JAR_SHA256: cbe4de976b13ecd1e9ffc8dd12db6186ef0788ad4d37388a4fdd5fd36e4e4ce3
      RUNTIME_RUN: '34147591233'
      COMPAT_RUN: '34147591147'
      AGGRESSIVE_RUN: '34147720996'
      RELEASE_TAG: potatoptimize-forge-1.20.1-parity-safe-r1
      RELEASE_JAR: Potatoptimize-Forge-1.20.1-ParitySafe-r1.jar
    steps:
      - name: Verify exact certification set
        run: |
          set -euxo pipefail
          for RUN in "$RUNTIME_RUN" "$COMPAT_RUN" "$AGGRESSIVE_RUN"; do
            JSON=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}")
            test "$(jq -r .conclusion <<<"$JSON")" = success
          done

          RUNTIME_JSON=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUNTIME_RUN}")
          COMPAT_JSON=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${COMPAT_RUN}")
          test "$(jq -r .head_sha <<<"$RUNTIME_JSON")" = "$SOURCE_SHA"
          test "$(jq -r .head_sha <<<"$COMPAT_JSON")" = "$SOURCE_SHA"

      - name: Download exact certified artifacts
        run: |
          set -euxo pipefail
          mkdir -p evidence/runtime evidence/compat evidence/aggressive release
          gh run download "$RUNTIME_RUN" -n potatoptimize-forge-1.20.1-runtime-evidence-and-jar -D evidence/runtime
          gh run download "$COMPAT_RUN" -n potatoptimize-forge-1.20.1-compat-stack-evidence -D evidence/compat
          gh run download "$AGGRESSIVE_RUN" -n potatoptimize-forge-1.20.1-aggressive-profile-evidence -D evidence/aggressive

          JAR=$(find evidence/runtime -type f -name 'potatoptimize-forge-1.20.1-1.0.0.jar' | head -n 1)
          AGGRESSIVE_JAR=$(find evidence/aggressive -type f -name 'potatoptimize-forge-1.20.1-1.0.0.jar' | head -n 1)
          test -n "$JAR"
          test -n "$AGGRESSIVE_JAR"

          ACTUAL=$(sha256sum "$JAR" | awk '{print $1}')
          AGGRESSIVE_ACTUAL=$(sha256sum "$AGGRESSIVE_JAR" | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_JAR_SHA256"
          test "$AGGRESSIVE_ACTUAL" = "$EXPECTED_JAR_SHA256"

          test -f evidence/aggressive/SWEEP-SUMMARY.txt || find evidence/aggressive -type f -name SWEEP-SUMMARY.txt -print -quit | grep -q .
          SUMMARY=$(find evidence/aggressive -type f -name SWEEP-SUMMARY.txt | head -n 1)
          test -n "$SUMMARY"
          ! grep -A999 '^=== FAMILY FAILURES ===' "$SUMMARY" | grep -E '^(block_entity|entity|fastmath|item|logic|memory|networking|random|remove|startup|threading|unstream|world|mixin\.|all-on)$'

          cp "$JAR" "release/$RELEASE_JAR"
          printf '%s  %s\n' "$EXPECTED_JAR_SHA256" "$RELEASE_JAR" > release/SHA256SUMS.txt
          printf '%s\n' "$SOURCE_SHA" > release/SOURCE_COMMIT.txt
          printf '%s\n' "$RUNTIME_RUN" > release/RUNTIME_QA_RUN.txt
          printf '%s\n' "$COMPAT_RUN" > release/COMPAT_QA_RUN.txt
          printf '%s\n' "$AGGRESSIVE_RUN" > release/AGGRESSIVE_QA_RUN.txt

          (cd evidence/runtime && zip -qr ../../release/runtime-certification-evidence.zip .)
          (cd evidence/compat && zip -qr ../../release/performance-stack-certification-evidence.zip .)
          (cd evidence/aggressive && zip -qr ../../release/aggressive-profile-linkage-evidence.zip .)

      - name: Write release notes
        run: |
          cat > release/RELEASE_NOTES.md <<'EOF'
          # Potatoptimize Forge 1.20.1 — Parity-Safe Port r1

          Native Forge 1.20.1 production port targeting Forge 47.4.23 and Java 17.

          ## Vanilla-parity default profile
          Behavior-changing, RNG-sequence-changing, loading, threading, save, profiler-removal, unsafe-random, and other semantically risky optimizations are **OFF by default**.

          Enabled by default:
          - sign ticking optimization
          - packed-int/data-bit arithmetic optimization
          - nearest item/player sensor stream-removal optimization

          Everything else is explicit opt-in where available.

          ## Forge port and hardening work
          - Native Forge packaging/remapping and early-loader compatibility handling.
          - Repaired packed-int constructor initialization for Forge Mixin 0.8.5 without dropping its arithmetic optimization.
          - Repaired optional ChunkSectionPos height-range logic that previously ignored requested Y bounds.
          - Repaired the optional fast-rounding target/remapping edge.
          - Repaired optional Random.create reuse as a Forge-safe interface static overwrite.
          - Repaired optional SimplePairList infinite-axis compaction with a Forge-safe constructor RETURN hook.
          - Removed Fabric-only launch assumptions and corrected Forge production remapping edges.
          - Added Forge pack metadata for clean startup.
          - Fixed persisted default config values being misreported as user overrides; normal first and second boots now report 0 overrides.
          - Compatibility detection/guards cover ModernFix, ServerCore, Krypton Reno (`kreno`), FasterRandom, C2ME, Lithium/Canary/Radium, Valkyrien Skies, EnhancedVisuals, and related known overlap cases.

          ## Certification
          Exact release source commit:
          `45768239855e00e50437c6f9d7d0b814caa731eb`

          Exact release JAR passed:
          1. Clean Forge 47.4.23 dedicated server build/remap, boot, gameplay/world exercise, save, clean shutdown, and second boot of the same world/config.
          2. Forge 47.4.23 performance-stack boot with ModernFix + ServerCore + FerriteCore + Krypton Reno/FNP, including compatibility guard and Mixin/runtime assertions.
          3. Isolated aggressive family linkage sweep: each option family is booted separately on a fresh world, failed families are automatically split into individual rules, followed by an all-on combination challenge. This certifies production linkage/runtime health for server/common paths; it does **not** claim vanilla semantic parity for aggressive opt-ins or dedicated-server proof of client-only experimental behavior.

          SHA-256 of `Potatoptimize-Forge-1.20.1-ParitySafe-r1.jar`:
          `cbe4de976b13ecd1e9ffc8dd12db6186ef0788ad4d37388a4fdd5fd36e4e4ce3`

          GPL-3.0 licensing from upstream is preserved.
          EOF

      - name: Create GitHub release from certified bytes
        run: |
          set -euxo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')
            test "$TAG_SHA" = "$SOURCE_SHA"
            gh release edit "$RELEASE_TAG" --title 'Potatoptimize Forge 1.20.1 - Parity-Safe r1' --notes-file release/RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$SOURCE_SHA" \
              --title 'Potatoptimize Forge 1.20.1 - Parity-Safe r1' \
              --notes-file release/RELEASE_NOTES.md
          fi

      - name: Upload immutable publication bundle
        uses: actions/upload-artifact@v4
        with:
          name: potatoptimize-forge-1.20.1-parity-safe-r1-publication
          path: release/*
          if-no-files-found: error
