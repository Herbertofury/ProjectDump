name: Async 1.20.1 Runtime Diagnostic

on:
  push:
    branches: [async-1.20.1-ultimate]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Vulkan runtime
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools

      - name: Reuse exact packaged JAR from failed native run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reused
          gh run download 34049938122 \
            --repo Herbertofury/ProjectDump \
            --name async-1.20.1-ultimate-release-candidate \
            --dir reused
          jarfile="$(find reused/release -maxdepth 1 -type f -name 'HariMultiThread-Ultimate-1.20.1-2.1.0-noxviola.1.jar' | head -n 1)"
          test -s "$jarfile"
          echo "$jarfile" > REUSED_JAR_PATH.txt
          sha256sum "$jarfile" | tee reused-jar.sha256

      - name: Install Forge 47.4.23 server
        shell: bash
        run: |
          mkdir -p diag-server/diag-evidence
          curl -fL --retry 3 \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar' \
            -o forge-installer.jar
          (cd diag-server && java -jar ../forge-installer.jar --installServer > diag-evidence/forge-install.log 2>&1)
          mkdir -p diag-server/mods
          cp "$(cat REUSED_JAR_PATH.txt)" diag-server/mods/HariMultiThread-Ultimate.jar
          printf 'eula=true\n' > diag-server/eula.txt
          cat > diag-server/server.properties <<'EOF'
          online-mode=false
          level-name=world
          level-seed=8675309
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          motd=HariMultiThread Runtime Diagnostic
          EOF

      - name: Prove classification, entity ticking, push mixin application
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess, threading, time
          from pathlib import Path

          root = Path('diag-server')
          out = root / 'diag-evidence' / 'runtime-diagnostic.log'
          env = os.environ.copy()
          env['JDK_JAVA_OPTIONS'] = (
              '-Dharimt.vulkan.allowCpuDevice=true '
              '-Dmixin.debug.verbose=true '
              '-Dmixin.debug.export=true '
              '-Dmixin.debug.export.filter=net.minecraft.world.entity.LivingEntity'
          )
          lines = []
          p = subprocess.Popen(['bash','run.sh','nogui'], cwd=root, stdin=subprocess.PIPE,
                               stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                               text=True, bufsize=1, env=env)
          assert p.stdin and p.stdout
          ready = threading.Event()
          def reader():
              for line in p.stdout:
                  print(line, end='', flush=True)
                  lines.append(line)
                  if 'Done (' in line:
                      ready.set()
          t = threading.Thread(target=reader, daemon=True)
          t.start()
          if not ready.wait(180):
              raise SystemExit('server did not reach Done marker')
          def send(cmd):
              print('[DIAG] >', cmd, flush=True)
              p.stdin.write(cmd+'\n'); p.stdin.flush()
          send('gamerule doMobSpawning false')
          send('forceload add 0 0')
          send('kill @e[tag=harimt_diag]')
          send('summon minecraft:cow 1.5 200 1.5 {Tags:["harimt_diag"],NoGravity:1b,Silent:1b,PersistenceRequired:1b,Invulnerable:1b,Fire:200s}')
          send('summon minecraft:cow 1.5 200 1.5 {Tags:["harimt_diag"],NoGravity:1b,Silent:1b,PersistenceRequired:1b,Invulnerable:1b,Fire:200s}')
          time.sleep(1.0)
          send('async stats')
          send('data get entity @e[tag=harimt_diag,limit=1,sort=nearest] Pos')
          send('data get entity @e[tag=harimt_diag,limit=1,sort=nearest] Fire')
          time.sleep(3.0)
          send('async stats')
          send('data get entity @e[tag=harimt_diag,limit=1,sort=nearest] Pos')
          send('data get entity @e[tag=harimt_diag,limit=1,sort=nearest] Fire')
          time.sleep(2.0)
          send('stop')
          rc = p.wait(timeout=60)
          t.join(timeout=5)
          out.write_text(''.join(lines), encoding='utf-8')
          if rc != 0:
              raise SystemExit(f'server exit {rc}')
          PY

      - name: Prove transformed LivingEntity bytecode contains HMT push hook
        shell: bash
        run: |
          exported="$(find diag-server/.mixin.out -type f -path '*/net/minecraft/world/entity/LivingEntity.class' -print -quit)"
          if test -z "$exported"; then
            echo 'Mixin export did not produce transformed LivingEntity.class' >&2
            find diag-server -maxdepth 5 -type f -path '*mixin*' -print || true
            exit 1
          fi
          echo "$exported" | tee diag-server/diag-evidence/transformed-livingentity-path.txt
          javap -c -p "$exported" | tee diag-server/diag-evidence/LivingEntity.transformed.javap.txt
          grep -F 'GpuPushBatch.shouldDefer' diag-server/diag-evidence/LivingEntity.transformed.javap.txt
          grep -F 'GpuPushBatch.defer' diag-server/diag-evidence/LivingEntity.transformed.javap.txt

      - name: Summarize diagnostic evidence
        shell: bash
        run: |
          log=diag-server/diag-evidence/runtime-diagnostic.log
          echo '=== HMT stats / cows / NBT ==='
          grep -Ei 'Performance Statistics|Entities:|Async|Workers:|harimt_diag|Cow has the following entity data|Pos:|Fire:' "$log" | tail -n 160 || true
          echo '=== GPU/push markers ==='
          grep -Ei 'Vulkan push|GpuPushBatch|GPU Entity Module|Compile-checked Vulkan' "$log" | tail -n 120 || true
          echo '=== transformed LivingEntity HMT calls ==='
          grep -n -F 'GpuPushBatch.' diag-server/diag-evidence/LivingEntity.transformed.javap.txt || true

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-runtime-diagnostic-evidence
          path: |
            diag-server/diag-evidence/
            reused-jar.sha256
          if-no-files-found: error
