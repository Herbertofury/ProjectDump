name: Project Constellation Browser Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'project-constellation/browser-gate/qv.b64.part*'
      - 'project-constellation/browser-gate/verify-quick-view.mjs'
      - '.github/workflows/project-constellation-browser-gate.yml'

permissions:
  contents: write

jobs:
  quick-view-browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reconstruct exact v0.5.1 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd project-constellation/browser-gate
          cat qv.b64.part01 qv.b64.part02 qv.b64.part03 qv.b64.part04 qv.b64.part05 qv.b64.part06 > qv.b64
          base64 --decode qv.b64 | gzip --decompress > quick-view.html
          actual="$(sha256sum quick-view.html | awk '{print $1}')"
          expected="8234e889c6b8cae67158c3cec525e3607bb8403173cf095e80c1b7ffd597ffe1"
          echo "candidate_sha256=$actual"
          test "$actual" = "$expected"
          test "$(wc -c < quick-view.html)" -eq 128283

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright browser runtime
        shell: bash
        run: |
          set -euo pipefail
          cd project-constellation/browser-gate
          npm init -y >/dev/null
          npm install --no-save playwright@1.63.0-alpha-2026-08-17
          npx playwright install --with-deps chromium

      - name: Exercise Quick View end-to-end
        shell: bash
        run: |
          set -euo pipefail
          node project-constellation/browser-gate/verify-quick-view.mjs project-constellation/browser-gate/quick-view.html 2>&1 | tee project-constellation/browser-gate/verify.log

      - name: Publish gate result
        if: always()
        shell: bash
        env:
          GATE_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-gate-result"
          if test -f project-constellation/browser-gate/verify.log; then
            cp project-constellation/browser-gate/verify.log "$RUNNER_TEMP/browser-gate-result/verify.log"
          fi
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p project-constellation/browser-gate
            cat > project-constellation/browser-gate/result.json <<EOF
          {
            "schema": "project-constellation.browser-gate/1",
            "workflowSha": "${GITHUB_SHA}",
            "candidateVersion": "0.5.1",
            "candidateSha256": "8234e889c6b8cae67158c3cec525e3607bb8403173cf095e80c1b7ffd597ffe1",
            "status": "${GATE_STATUS}",
            "checkedAt": "${checked_at}"
          }
          EOF
            if test -f "$RUNNER_TEMP/browser-gate-result/verify.log"; then
              cp "$RUNNER_TEMP/browser-gate-result/verify.log" project-constellation/browser-gate/verify.log
            fi
            git add project-constellation/browser-gate/result.json
            if test -f project-constellation/browser-gate/verify.log; then
              git add project-constellation/browser-gate/verify.log
            fi
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "state: record Project Constellation browser gate [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Result publication raced with another main update; retrying attempt ${attempt}."
          done
          echo "Unable to publish browser-gate result after five fast-forward retries." >&2
          exit 1
