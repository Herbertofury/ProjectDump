name: Recover Potatoptimize Forge 1.20.1 Port

on:
  push:
    paths:
      - '.github/workflows/potatoptimize-forge-port-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch pinned upstream
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 1.20.1 https://github.com/Tater-Certified/Potatoptimize.git /tmp/potatoptimize-upstream
          test "$(git -C /tmp/potatoptimize-upstream rev-parse HEAD)" = "35d97cf913ae39d45740a51d23cdd161d06e4a43"

      - name: Reuse exact source generator from canonical workflow
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/potatoptimize-forge-port.yml')
          lines = p.read_text(encoding='utf-8').splitlines()
          marker = '      - name: Generate native Forge source tree'
          start = lines.index(marker)
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i].startswith('        run: |'))
          end = next((i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name: ')), len(lines))
          body = []
          for line in lines[run_line + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/generate-potatoptimize.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash /tmp/generate-potatoptimize.sh

      - name: Forge platform, Gradle 8.8, conservative defaults
        working-directory: minecraft/potatoptimize-forge-1.20.1
        run: |
          set -euxo pipefail
          sed -i 's/gradle-8\.7-bin\.zip/gradle-8.8-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          printf '\nloom.platform=forge\n' >> gradle.properties
          DEFAULTS=src/main/resources/assets/potatoptimize/potatoptimize-mixin-config-default.properties
          sed -i 's/^mixin.logic.main_thread = true$/mixin.logic.main_thread = false/' "$DEFAULTS"
          sed -i 's/^mixin.logic.worker_thread = true$/mixin.logic.worker_thread = false/' "$DEFAULTS"
          grep -q 'gradle-8.8-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -q '^loom.platform=forge$' gradle.properties
          grep -q '^mixin.logic.main_thread = false$' "$DEFAULTS"
          grep -q '^mixin.logic.worker_thread = false$' "$DEFAULTS"

      - name: Build Forge production JAR
        working-directory: minecraft/potatoptimize-forge-1.20.1
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Inspect and hash production JAR
        working-directory: minecraft/potatoptimize-forge-1.20.1
        run: |
          set -euxo pipefail
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)
          test -n "$JAR"
          unzip -l "$JAR" | tee build/jar-contents.txt
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'modId="potatoptimize"'
          unzip -p "$JAR" potatoptimize.mixins.json | grep -q 'MixinConfig'
          unzip -p "$JAR" assets/potatoptimize/potatoptimize-mixin-config-default.properties | grep -q 'mixin.world.explosion = false'
          unzip -p "$JAR" assets/potatoptimize/potatoptimize-mixin-config-default.properties | grep -q 'mixin.logic.main_thread = false'
          unzip -p "$JAR" assets/potatoptimize/potatoptimize-mixin-config-default.properties | grep -q 'mixin.logic.worker_thread = false'
          sha256sum "$JAR" | tee build/SHA256SUMS.txt

      - name: Commit verified source checkpoint
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft/potatoptimize-forge-1.20.1
          git commit -m 'minecraft: add compiled Potatoptimize Forge 1.20.1 parity-safe port'
          git push

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: potatoptimize-forge-1.20.1-parity-safe-rc
          path: |
            minecraft/potatoptimize-forge-1.20.1/build/libs/*.jar
            minecraft/potatoptimize-forge-1.20.1/build/SHA256SUMS.txt
            minecraft/potatoptimize-forge-1.20.1/README.md
            minecraft/potatoptimize-forge-1.20.1/PORT-NOTES.md
          if-no-files-found: error
