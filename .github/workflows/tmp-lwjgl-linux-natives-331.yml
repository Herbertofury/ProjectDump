name: tmp-lwjgl-linux-natives-331

on:
  push:
    branches:
      - tmp/simplyswords-1.70.2-fetch-20260906

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact LWJGL 3.3.1 Linux natives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p natives
          base='https://repo1.maven.org/maven2/org/lwjgl'
          mods=(lwjgl lwjgl-glfw lwjgl-jemalloc lwjgl-openal lwjgl-opengl lwjgl-stb lwjgl-tinyfd)
          for mod in "${mods[@]}"; do
            file="${mod}-3.3.1-natives-linux.jar"
            url="$base/$mod/3.3.1/$file"
            echo "Fetching $url"
            curl -fL --retry 2 --connect-timeout 20 --max-time 120 "$url" -o "natives/$file"
            unzip -tqq "natives/$file"
          done
          sha256sum natives/*.jar | tee SHA256SUMS.txt
          stat -c '%n %s bytes' natives/*.jar | tee FILESIZE.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-3.3.1-linux-natives
          path: |
            natives/*.jar
            SHA256SUMS.txt
            FILESIZE.txt
          retention-days: 1
          if-no-files-found: error
