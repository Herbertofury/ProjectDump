name: tmp-srgutils-0411-fetch

on:
  push:
    branches:
      - tmp/simplyswords-1.70.2-fetch-20260906

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact Forge srgutils 0.4.11
        shell: bash
        run: |
          set -euo pipefail
          url='https://maven.minecraftforge.net/net/minecraftforge/srgutils/0.4.11/srgutils-0.4.11.jar'
          curl -fL --retry 2 --connect-timeout 20 --max-time 120 "$url" -o srgutils-0.4.11.jar
          unzip -tqq srgutils-0.4.11.jar
          sha256sum srgutils-0.4.11.jar | tee SHA256SUMS.txt
          stat -c '%n %s bytes' srgutils-0.4.11.jar | tee FILESIZE.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: srgutils-0.4.11
          path: |
            srgutils-0.4.11.jar
            SHA256SUMS.txt
            FILESIZE.txt
          retention-days: 1
          if-no-files-found: error
