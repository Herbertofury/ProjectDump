name: Recover v0.5.1 durable payload
# recovery rerun with exact Quick View and Master payloads present

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-v051-payload-sanitize.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Diagnose and sanitize durable browser-gate payloads
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/pc-v051-sourcebundle:refs/remotes/origin/automation/pc-v051-sourcebundle
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json, re, subprocess

          root = Path('project-constellation/browser-gate')
          fallback_ref = 'origin/automation/pc-v051-sourcebundle'
          specs = {
            'qv': (128283, '8234e889c6b8cae67158c3cec525e3607bb8403173cf095e80c1b7ffd597ffe1'),
            'master': (143064, 'dd1f852bf4f7d677d3a499a7238359dff55aa6a3bc3f338c534dca2c89faa1a8'),
          }

          def decode_text(text):
              compact = re.sub(r'\s+', '', text)
              invalid = [(i, ch, ord(ch)) for i, ch in enumerate(compact) if ch not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=']
              filtered = ''.join(ch for ch in compact if ch in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
              raw = base64.b64decode(filtered, validate=False)
              return compact, invalid, filtered, raw, gzip.decompress(raw)

          def fallback_text(stem):
              names = subprocess.check_output([
                  'git','ls-tree','-r','--name-only',fallback_ref,'project-constellation/browser-gate'
              ], text=True).splitlines()
              names = sorted(n for n in names if Path(n).name.startswith(f'{stem}.b64.part'))
              if not names:
                  raise RuntimeError(f'No fallback payload parts for {stem}')
              chunks = [subprocess.check_output(['git','show',f'{fallback_ref}:{name}'], text=True) for name in names]
              return names, ''.join(chunks)

          report = {'schema':'project-constellation.v051-payload-recovery/2','fallbackRef':fallback_ref,'payloads':{},'status':'RUNNING'}
          all_ok = True
          for stem, (expected_size, expected_sha) in specs.items():
              paths = sorted(root.glob(f'{stem}.b64.part*'))
              current_text = ''.join(p.read_text(encoding='ascii') for p in paths)
              entry = {'parts':[{'name':p.name,'bytes':p.stat().st_size} for p in paths]}
              data = None
              try:
                  compact, invalid, filtered, raw, candidate = decode_text(current_text)
                  entry.update({
                      'encodedChars':len(compact),'filteredChars':len(filtered),'invalidCount':len(invalid),
                      'invalidFirst':[{'index':i,'char':ch,'ord':n} for i,ch,n in invalid[:20]],
                      'compressedBytes':len(raw),'compressedSha256':hashlib.sha256(raw).hexdigest(),
                      'decodedBytes':len(candidate),'decodedSha256':hashlib.sha256(candidate).hexdigest(),
                  })
                  if len(candidate) == expected_size and hashlib.sha256(candidate).hexdigest() == expected_sha:
                      data = candidate
                      entry['source'] = 'current-main-payload'
                  else:
                      entry['currentMismatch'] = True
              except Exception as exc:
                  entry['currentError'] = repr(exc)

              if data is None:
                  try:
                      fallback_names, source_text = fallback_text(stem)
                      compact, invalid, filtered, raw, candidate = decode_text(source_text)
                      entry['fallback'] = {
                          'parts':fallback_names,'encodedChars':len(compact),'invalidCount':len(invalid),
                          'compressedBytes':len(raw),'compressedSha256':hashlib.sha256(raw).hexdigest(),
                          'decodedBytes':len(candidate),'decodedSha256':hashlib.sha256(candidate).hexdigest(),
                      }
                      if len(candidate) == expected_size and hashlib.sha256(candidate).hexdigest() == expected_sha:
                          data = candidate
                          entry['source'] = 'verified-sourcebundle-fallback'
                      else:
                          entry['fallbackMismatch'] = True
                  except Exception as exc:
                      entry['fallbackError'] = repr(exc)

              if data is None:
                  entry['sizeMatch'] = False
                  entry['shaMatch'] = False
                  all_ok = False
              else:
                  entry['sizeMatch'] = len(data) == expected_size
                  entry['shaMatch'] = hashlib.sha256(data).hexdigest() == expected_sha
                  canonical = base64.b64encode(gzip.compress(data, compresslevel=9, mtime=0)).decode('ascii') + '\n'
                  (root / f'{stem}.b64.part01').write_text(canonical, encoding='ascii')
                  for extra in sorted(root.glob(f'{stem}.b64.part*')):
                      if extra.name != f'{stem}.b64.part01':
                          extra.unlink()
                  entry['canonicalEncodedChars'] = len(canonical.strip())
                  entry['canonicalPart'] = f'{stem}.b64.part01'
              report['payloads'][stem] = entry

          report['status'] = 'SANITIZED_EXACT' if all_ok else 'DIAGNOSTIC_FAILED'
          (root / 'payload-recovery-diagnostic.json').write_text(json.dumps(report, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          PY

      - name: Commit durable diagnostic and any exact payload repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-constellation/browser-gate/payload-recovery-diagnostic.json
          git add project-constellation/browser-gate/qv.b64.part* project-constellation/browser-gate/master.b64.part* 2>/dev/null || true
          git add -u project-constellation/browser-gate
          status="$(jq -r '.status' project-constellation/browser-gate/payload-recovery-diagnostic.json)"
          git commit -m "recovery: record v0.5.1 payload status ${status} [skip ci]"
          git push origin HEAD:main

      - name: Require exact recovered payloads
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.status == "SANITIZED_EXACT" and .payloads.qv.shaMatch == true and .payloads.master.shaMatch == true' project-constellation/browser-gate/payload-recovery-diagnostic.json >/dev/null

      - name: Dispatch deterministic publisher and require success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow='recover-project-constellation-v051-deterministic.yml'
          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
          run_id=''
          for _ in $(seq 1 60); do
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$candidate" != '0' && "$candidate" != "$before" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          echo "Deterministic publisher run: $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
