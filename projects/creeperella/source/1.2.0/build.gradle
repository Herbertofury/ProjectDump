plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.29,8.0)'
    id 'net.minecraftforge.renamer' version '1.1.2'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-${minecraft_version}-forge"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDir = file('run')
            systemProperty 'forge.logging.console.level', 'info'
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

// Minecraft 1.20.1 still uses SRG names at runtime. ForgeGradle 7 delegates
// production remapping to the standalone Renamer plugin for 1.20.4 and older.
renamer.mappings.from minecraft.dependency.toSrgFile
renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = 'srg'
}

tasks.named('build') {
    dependsOn tasks.named('renameJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': 'Herbertofury',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Herbertofury'
        ])
    }
}
